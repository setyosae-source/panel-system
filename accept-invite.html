<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Vision — Aktivasi Akun</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#eef3f7;color:#142733;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.box{width:min(440px,100%);background:#fff;border:1px solid #b8cad7;border-radius:14px;padding:20px;box-shadow:0 12px 36px #24445a20}h1{margin:0 0 7px;font-size:23px}.brand{font-weight:850;letter-spacing:.06em;margin-bottom:15px}.brand b{color:#ef3434}.muted{color:#536b7b}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#536b7b;margin-bottom:5px}.input{width:100%;border:1px solid #aebfca;border-radius:8px;padding:11px;font:inherit}.btn{width:100%;margin-top:14px;border:1px solid #287fb2;border-radius:8px;background:#dceef8;color:#123f58;padding:11px;font:700 15px system-ui;cursor:pointer}.btn:disabled{opacity:.5}.notice,.success,.error{border:1px solid;border-radius:9px;padding:10px 11px;margin-top:12px}.notice{background:#eaf5fc;border-color:#79abc8;color:#174966}.success{background:#e8f7ef;border-color:#62a989;color:#15563d}.error{background:#fff0f2;border-color:#ca8792;color:#8a2634}.hidden{display:none}
</style>
</head>
<body><main class="box"><div class="brand"><b>SAE</b> ENERGY · PANEL VISION</div><h1>Aktivasi Akun</h1><div class="muted">Buat password pribadi untuk menyelesaikan undangan Panel Vision.</div><div id="form" class="hidden"><div class="field"><label>Password baru — minimal 8 karakter</label><input class="input" id="password" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Ulangi password</label><input class="input" id="confirmPassword" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" id="saveBtn">Aktifkan Akun</button></div><div id="msg" class="notice">Memeriksa link undangan…</div></main>
<script>
const SB_URL='https://sswslwddemackxrrbpre.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzd3Nsd2RkZW1hY2t4cnJicHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTE2MjcsImV4cCI6MjA5MTMyNzYyN30.aQivrCTGvzJ6-_OLUOUvFjOcu7qQ53Ajv2urvLZb9xg';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
function status(text,type='notice'){$('msg').textContent=text;$('msg').className=type}
async function checkSession(){const {data:{session}}=await sb.auth.getSession();if(session){$('form').classList.remove('hidden');status(`Undangan untuk ${session.user.email||'user'} sudah diverifikasi. Silakan buat password.`);return true}status('Link undangan tidak valid atau sudah kedaluwarsa. Minta owner mengirim ulang undangan.','error');return false}
$('saveBtn').onclick=async()=>{const password=$('password').value,confirmation=$('confirmPassword').value;if(password.length<8)return status('Password minimal 8 karakter.','error');if(password!==confirmation)return status('Ulangi password belum sama.','error');$('saveBtn').disabled=true;status('Menyimpan password…');const {error}=await sb.auth.updateUser({password});$('saveBtn').disabled=false;if(error)return status(error.message,'error');$('form').classList.add('hidden');status('Akun berhasil diaktifkan. Anda sekarang dapat login ke Remote HMI sesuai unit dan hak akses yang diberikan.','success')};
sb.auth.onAuthStateChange((_event,session)=>{if(session){$('form').classList.remove('hidden');status(`Undangan untuk ${session.user.email||'user'} sudah diverifikasi. Silakan buat password.`)}});
setTimeout(checkSession,600);
</script></body></html>
