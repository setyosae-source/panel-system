  allPOs.forEach(p => {
    (p.po_items||[]).filter(it=>it.is_produksi).forEach(it => {
      prodTotal++;
      const pics = (p.po_pic||[]).filter(x=>x.item_id===it.id && x.stage==='Produksi');
      if(pics.length===0) prodNeedAssign++;
    });
  });

  const svcNeedAssign = (tickets||[]).filter(t=>!t.pic_id).length;

  const tabBtn = (key, label, count) =>
    `<button onclick="assignTab='${key}';renderAssignList()" style="padding:8px 16px;background:${assignTab===key?'var(--text)':'var(--surface)'};color:${assignTab===key?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;cursor:pointer;font-weight:500">${label}${count?` <span style="opacity:.6;margin-left:4px">(${count})</span>`:''}</button>`;

  let instNeedAssign = 0;
  allPOs.forEach(p => {
    if(!p.has_instalasi && !p.has_commissioning) return;
    (p.po_items||[]).filter(it=>it.is_produksi).forEach(it => {
      const pics = (p.po_pic||[]).filter(x=>x.item_id===it.id && x.stage==='Instalasi');
      if(pics.length===0) instNeedAssign++;
    });
  });

  let body = `<div style="display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap">
    ${tabBtn('produksi','Produksi',prodNeedAssign)}
    ${tabBtn('instalasi','Instalasi & Commissioning',instNeedAssign)}
    ${tabBtn('service','Service',svcNeedAssign)}
  </div>`;

  if(assignTab==='produksi') body += renderAssignProduksi();
  else if(assignTab==='instalasi') body += renderAssignInstalasi();
  else body += renderAssignService(tickets||[]);

  document.getElementById('assignBody').innerHTML = body;
}

    `<td>${item.category}</td>`,

async function openAssignProduksiModal(itemId, poId) {
  const po = allPOs.find(x=>x.id===poId);

  if(!item) return;

  const {data: teknisi} = await sb.from('app_users').select('id,full_name,role').in('role',['teknisi','engineering']).eq('is_active',true).order('full_name');
  const list = teknisi||[];

  const {data: existing} = await sb.from('po_pic').select('user_id').eq('po_id',poId).eq('item_id',itemId).eq('stage','Produksi');
  const picIds = (existing||[]).map(p=>p.user_id);

  const cbs = list.map(t=>
    `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 8px;background:${picIds.includes(t.id)?'var(--amber-bg)':'var(--surface2)'};border-radius:var(--r-sm);cursor:pointer">

    </label>`
  ).join('');

  // ─── Section Serial Number ────────────────────────────────
  // Hanya tampil untuk item yang butuh ETS dan kategori produksi utama (yang generatable).
  let snSection = '';
  const snGeneratable = item.needs_ets && SPEC_CATEGORIES.includes(item.category);
  if (snGeneratable) {
    if (item.serial_number) {
      // Sudah ada SN — tampilkan read-only
      snSection = `<div style="margin-bottom:14px;padding:10px;background:var(--green-bg);border:1px solid var(--green);border-radius:var(--r-sm)">
        <div style="font-size:11px;font-weight:600;color:var(--green);margin-bottom:4px">SERIAL NUMBER</div>
        <div style="font-family:monospace;font-size:13px;color:var(--text)">${item.serial_number}</div>
      </div>`;
    } else {
      // Cek apakah spec sudah lengkap
      let spec = null;
      try { const _r = await sb.from('item_specs').select('*').eq('item_id', itemId).single(); spec = _r.data; } catch(e) {}
      const hasMinSpec = spec && spec.kategori && (spec.output_voltage || spec.output_current || spec.output_kva);
      if (!hasMinSpec) {
        snSection = `<div style="margin-bottom:14px;padding:10px;background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r-sm);font-size:12px;color:var(--amber)">

        </div>`;

// Generate SN untuk 1 item langsung dari modal Assign Produksi.
// Handle qty: kalau qty>1, generate multiple SN dan join dengan ', '.
async function generateSNForItem(itemId, poId) {
  const dateStr = gv('apicProdDate');
  if (!dateStr) { toast('Pilih tanggal mulai produksi'); return; }
  const prodDate = new Date(dateStr);
  const po = allPOs.find(x=>x.id===poId);
  const item = po?.po_items?.find(x=>x.id===itemId);
  if (!item) { toast('Item tidak ditemukan'); return; }
  if (item.serial_number) { toast('Item sudah punya SN'); return; }

  // Load spec terstruktur
  let spec = null;
  try { const _r = await sb.from('item_specs').select('*').eq('item_id', itemId).single(); spec = _r.data; } catch(e) {}
  if (!spec || !spec.kategori) { toast('Spec belum diisi. Isi via ETS dulu.'); return; }

  const qty = item.qty || 1;
  const serials = [];
  // Loop per unit (multi-SN per item)
  for (let i = 0; i < qty; i++) {
    const { data: counter } = await sb.from('serial_counter').select('*').eq('id', 1).single();
    let { huruf, angka } = counter;
    const sn = buildSerialNumberFromSpec(spec, po.no_project, huruf, angka, prodDate);
    if (!sn) { toast('Gagal generate SN — cek field spec'); return; }
    angka++;
    if (angka > 999) { angka = 1; huruf = String.fromCharCode(huruf.charCodeAt(0) + 1); }
    await sb.from('serial_counter').update({ huruf, angka }).eq('id', 1);
    serials.push(sn);
  }

  const snJoined = serials.join(', ');
  await sb.from('po_items').update({
    serial_number: snJoined,
    serial_generated_at: new Date().toISOString()
  }).eq('id', itemId);
  await logPO(poId, 'Generate Serial', item.category + ': ' + snJoined);
  toast(serials.length + ' SN di-generate: ' + snJoined);
  // Re-open modal dengan SN baru
  closeAllModals();
  await loadPOs();
  openAssignProduksiModal(itemId, poId);
}

let _ainstCache = null;

function _buildAinstTable(items) {
  const st = tblState('ainst');
  const filtered = tblFilterBySearch(items, st.search);
  const columns = [
    { key:'no_project', label:'No. Project', sortable:true, style:'' },
    { key:'category', label:'Kategori', sortable:true, style:'' },
    { key:'model_name', label:'Model', sortable:true, style:'' },
    { key:'serial_number', label:'Serial Number', sortable:true, style:'' },
    { key:'flag', label:'Tipe', sortable:false, style:'' },
    { key:'pic', label:'PIC Instalasi', sortable:false, style:'' },
    { key:'action', label:'', sortable:false, style:'' },
  ];
  const getColumns = ({po, item, pics}) => {
    const flags = [po.has_instalasi?'Instalasi':'', po.has_commissioning?'Commissioning':''].filter(Boolean).join(' + ');
    return [
      `<td class="mono" style="font-weight:500;color:var(--accent)">${po.no_project || po.no_po}</td>`,
      `<td>${item.category}</td>`,
      `<td style="font-weight:500">${item.model_name||'<span style="color:var(--text3)">(belum ada model)</span>'}</td>`,
      `<td class="mono">${item.serial_number || '<span style="color:var(--text3);font-family:inherit">—</span>'}</td>`,
      `<td><span style="background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600">${flags}</span></td>`,
      `<td>${pics.length ? `<span>${pics.map(x=>x.app_users?.full_name||'?').join(', ')}</span>` : '<span style="color:var(--coral);font-weight:500;font-size:12px">⚠ Belum di-assign</span>'}</td>`,
      `<td><button class="btn btn-sm btn-primary" data-iid="${item.id}" data-pid="${po.id}" onclick="event.stopPropagation();openAssignInstalasiModal(this.dataset.iid,this.dataset.pid)">${pics.length?'Ubah':'Assign'}</button></td>`
    ];
  };
  const rows = filtered.length === 0
    ? `<tr class="empty-row"><td colspan="${columns.length}">Tidak ada item cocok</td></tr>`
    : tblGroupedRows('ainst', filtered, getColumns, columns.length);
  return { header: tblSortHeader('ainst', columns), rows };
}

async function updateProdStatus(newStatus) {
  const item = window._prodCurrentItem;
  // Update local state immediately for instant UI response
  item.item_status = newStatus;
  
  // Track timestamps for transitions
  const now = new Date().toISOString();
  const updates = {item_status: newStatus};
  if(newStatus === 'Proses Produksi' && !item.prod_started_at) {
    updates.prod_started_at = now;
    item.prod_started_at = now;
  } else if(newStatus === 'QC' && !item.qc_started_at) {
    updates.qc_started_at = now;
    item.qc_started_at = now;
  } else if(newStatus === 'Selesai Produksi' && !item.prod_finished_at) {
    updates.prod_finished_at = now;
    item.prod_finished_at = now;
  }
  
  renderProdStatus();
  toast('Status diperbarui');
  
  sb.from('po_items').update(updates).eq('id', item.id).then(()=>{
    logPO(window._prodCurrentPO.id, 'Update Status Item', `${item.category} ${item.model_name||''} → ${newStatus}`);
  });
}

async function saveMaterialRequest() {
  const name = gv('mtName').trim();
  const qty = parseFloat(gv('mtQty')) || 0;
  const satuan = gv('mtSatuan').trim();
  const alasan = gv('mtAlasan').trim();
  if(!name || !qty) { toast('Nama dan qty wajib diisi'); return; }

  const item = window._prodCurrentItem;
  const me = currentUser;

  await sb.from('material_requests').insert({
    item_id: item.id,
    user_id: me.id,
    material_name: name,
    qty, satuan, alasan,
    status: 'Diajukan'
  });

  // Add to material_master (upsert)
  const {data: existing} = await sb.from('material_master').select('id,use_count').eq('name',name).maybeSingle();
  if(existing) {
    await sb.from('material_master').update({use_count:(existing.use_count||0)+1, last_used_at: new Date().toISOString(), satuan: satuan||null}).eq('id',existing.id);
  } else {
    await sb.from('material_master').insert({name, satuan: satuan||null});
  }

  await logPO(window._prodCurrentPO.id, 'Permintaan Material', `${name} ${qty} ${satuan}`);
  toast('Permintaan diajukan');
  closeTopModal();
  await renderProdMaterial();
}

let etsFilter = 'all'; // all | pending | done

async function renderETSModule() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="topbar">
    <button class="btn btn-ghost btn-sm icon-only" onclick="openSidebar()"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div><div class="page-title">ETS</div><div class="page-sub">Engineering & Technical Support</div></div>
  </div>
  <div class="page-body" id="etsBody"><div style="text-align:center;padding:3rem;color:var(--text3)">Memuat...</div></div>`;

// Build state ETS (filter+sort+search), return rows+header HTML
function _buildEtsTable(allItems, dsItemIds) {
  let filtered = allItems;
  if(etsFilter === 'pending') filtered = allItems.filter(x=>x.isPending);
  else if(etsFilter === 'done') filtered = allItems.filter(x=>!x.isPending);

  const st = tblState('ets');
  filtered = tblFilterBySearch(filtered, st.search);

  // Sort: No. Project desc (terbaru di atas)
  filtered.sort((a, b) => {
    const da = a.po.no_project || a.po.no_po || '';
    const db = b.po.no_project || b.po.no_po || '';
    return db.localeCompare(da);
  });

  if (filtered.length === 0) {
    return { rows: `<tr class="empty-row"><td colspan="4" style="text-align:center;padding:2rem;color:var(--text3)">Tidak ada item</td></tr>` };
  }

  const rows = filtered.map(({po, item, hasSpec, hasDetailSpec}) => {
    const isExpanded = _etsExpandedId === item.id;
    const arrow = isExpanded ? '▲' : '▼';
    const itemLabel = `${item.category}${item.model_name ? ' · ' + item.model_name : ''}`;
    const statusBadges = [
      hasSpec ? '<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 7px;border-radius:4px;font-weight:600">SN ✓</span>' : '<span style="font-size:10px;background:#fee2e2;color:#991b1b;padding:2px 7px;border-radius:4px;font-weight:600">Belum SN</span>',
      hasDetailSpec ? '<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 7px;border-radius:4px;font-weight:600">Detail ✓</span>' : '<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:4px;font-weight:600">Detail ✕</span>'
    ].join(' ');

    const detailRow = !isExpanded ? '' : `
      <tr class="ets-detail-row">
        <td colspan="4" style="background:#f8fafc;padding:14px 16px;border-top:none">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;font-size:12px">
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">No. PO</div><div class="mono" style="margin-top:2px;font-weight:500">${po.no_po}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Project</div><div style="margin-top:2px;font-weight:500">${po.project_name || '—'}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Serial Number</div><div class="mono" style="margin-top:2px;font-weight:500">${item.serial_number || '—'}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Status ETS</div><div style="margin-top:2px;display:flex;gap:4px;flex-wrap:wrap">${statusBadges}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Qty</div><div style="margin-top:2px">${item.qty || 1}</div></div>
            ${item.spec_summary ? `<div style="grid-column:1/-1"><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Spec Summary</div><div style="margin-top:2px">${escapeHtml(item.spec_summary)}</div></div>` : ''}
          </div>
          <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm" data-iid="${item.id}" data-pid="${po.id}" onclick="event.stopPropagation();openEditItemForm(this.dataset.iid,this.dataset.pid)">Edit</button>
            ${!item.serial_number ? `<button class="btn btn-sm btn-blue" data-iid="${item.id}" data-pid="${po.id}" onclick="event.stopPropagation();openItemSpec(this.dataset.iid,this.dataset.pid)">Input Spec</button>` : ''}
            <button class="btn btn-sm btn-primary" data-iid="${item.id}" data-pid="${po.id}" onclick="event.stopPropagation();openDetailSpecModal(this.dataset.iid,this.dataset.pid)">Detail Spec</button>
          </div>
        </td>
      </tr>`;

    return `
      <tr onclick="toggleEtsRow('${item.id}')" style="cursor:pointer">
        <td class="mono" style="font-weight:500;color:var(--accent)">${po.no_project || po.no_po}</td>
        <td>${po.customer_name || '—'}</td>
        <td>${itemLabel}</td>
        <td style="text-align:center;color:var(--text3);width:30px">${arrow}</td>
      </tr>
      ${detailRow}`;
  }).join('');

  return { rows };
}

let _etsCache = null;
let _etsExpandedId = null;

function toggleEtsRow(itemId) {
  _etsExpandedId = (_etsExpandedId === itemId) ? null : itemId;
  refresh_ets();
}

async function renderETSList() {
  const {data: dsAll} = await sb.from('item_detail_specs').select('item_id');
  const dsItemIds = new Set((dsAll||[]).map(x=>x.item_id));

  const allItems = [];
  for(const p of allPOs) {
    for(const it of (p.po_items||[]).filter(x=>x.needs_ets)) {
      const hasSpec = !!it.serial_number;
      const hasDetailSpec = dsItemIds.has(it.id);
      const isPending = !hasSpec || !hasDetailSpec;
      allItems.push({po:p, item:it, hasSpec, hasDetailSpec, isPending});
    }
  }
  _etsCache = { allItems, dsItemIds };

  const pendingCount = allItems.filter(x=>x.isPending).length;
  const doneCount = allItems.length - pendingCount;

  const filterBtn = (key, label, count) =>
    `<button onclick="etsFilter='${key}';refresh_ets()" style="padding:6px 14px;background:${etsFilter===key?'var(--text)':'var(--surface)'};color:${etsFilter===key?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;cursor:pointer">${label} <span style="opacity:.7">(${count})</span></button>`;

  const st = tblState('ets');
  const tbl = _buildEtsTable(allItems, dsItemIds);

  document.getElementById('etsBody').innerHTML = `
    <div class="toolbar-row">
      <div class="search-wrap" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;display:flex;align-items:center;gap:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="etsSearchInput" placeholder="Cari No. PO, customer, model, SN..." value="${st.search}" oninput="onEtsSearchInput(event)" style="flex:1;border:none;outline:none;background:transparent;font-size:13px;font-family:inherit">
      </div>
      <div id="etsFilterBtns" style="display:flex;gap:6px;flex-wrap:wrap">
        ${filterBtn('all', 'Semua', allItems.length)}
        ${filterBtn('pending', 'Belum Lengkap', pendingCount)}
        ${filterBtn('done', 'Lengkap', doneCount)}
      </div>
    </div>
    <div class="table-card">
      <div class="table-wrap">
        <table style="">
          <thead>
            <tr>
              <th style="min-width:90px">No. Project</th>
              <th style="">Customer</th>
              <th style="">Item</th>
              <th style="min-width:30px"></th>
            </tr>
          </thead>
          <tbody data-tbl="ets">${tbl.rows}</tbody>
        </table>
      </div>
    </div>`;
}

// Partial refresh: hanya tbody+thead, supaya input search tidak kehilangan fokus
function refresh_ets() {
  if (!_etsCache) { renderETSList(); return; }
  const tbl = _buildEtsTable(_etsCache.allItems, _etsCache.dsItemIds);
  const tbody = document.querySelector('tbody[data-tbl="ets"]');
  if (tbody) tbody.innerHTML = tbl.rows;
  // Update filter button counts juga
  const pendingCount = _etsCache.allItems.filter(x=>x.isPending).length;
  const doneCount = _etsCache.allItems.length - pendingCount;
  const fb = document.getElementById('etsFilterBtns');
  if (fb) {
    const filterBtn = (key, label, count) =>
      `<button onclick="etsFilter='${key}';refresh_ets()" style="padding:6px 14px;background:${etsFilter===key?'var(--text)':'var(--surface)'};color:${etsFilter===key?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;cursor:pointer">${label} <span style="opacity:.7">(${count})</span></button>`;
    fb.innerHTML = `${filterBtn('all', 'Semua', _etsCache.allItems.length)}
      ${filterBtn('pending', 'Belum Lengkap', pendingCount)}
      ${filterBtn('done', 'Lengkap', doneCount)}`;
  }
}

function onEtsSearchInput(ev) {
  tblState('ets').search = ev.target.value;
  refresh_ets();
}

let _prodCache = null;
let _prodExpandedId = null;

function _buildProdTable(tasks) {
  const STATUS_COLORS = {
    'Belum Produksi': {bg:'#f1f5f9', color:'#475569'},
    'Proses Produksi': {bg:'#fef3c7', color:'#92400e'},
    'QC': {bg:'#dbeafe', color:'#1e40af'},
    'Selesai Produksi': {bg:'#d1fae5', color:'#065f46'}
  };
  const st = tblState('prod');
  const filtered = tblFilterBySearch(tasks, st.search);

  // Sort: No. Project desc (terbaru di atas)
  filtered.sort((a, b) => {
    const da = a.po.no_project || a.po.no_po || '';
    const db = b.po.no_project || b.po.no_po || '';
    return db.localeCompare(da);
  });

  if (filtered.length === 0) {
    return { rows: `<tr class="empty-row"><td colspan="4" style="text-align:center;padding:2rem;color:var(--text3)">${tasks.length === 0 ? 'Tidak ada tugas produksi aktif' : 'Tidak ada hasil pencarian'}</td></tr>`, count: 0 };
  }

  const rows = filtered.map(({po, item}) => {
    const sc = STATUS_COLORS[item.item_status] || STATUS_COLORS['Belum Produksi'];
    const myPics = (po.po_pic||[]).filter(x => x.item_id === item.id && x.stage === 'Produksi');
    const picNames = myPics.length ? myPics.map(x => x.app_users?.full_name || '?').join(', ') : '—';
    const isExpanded = _prodExpandedId === item.id;
    const arrow = isExpanded ? '▲' : '▼';
    const itemLabel = `${item.category}${item.model_name ? ' · ' + item.model_name : ''}`;

    const detailRow = !isExpanded ? '' : `
      <tr class="prod-detail-row">
        <td colspan="4" style="background:#f8fafc;padding:14px 16px;border-top:none">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;font-size:12px">
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">No. PO</div><div class="mono" style="margin-top:2px;font-weight:500">${po.no_po}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Project</div><div style="margin-top:2px;font-weight:500">${po.project_name || '—'}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Serial Number</div><div class="mono" style="margin-top:2px;font-weight:500">${item.serial_number || '—'}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Status</div><div style="margin-top:2px"><span style="font-size:11px;background:${sc.bg};color:${sc.color};padding:3px 8px;border-radius:4px;font-weight:600">${item.item_status || 'Belum Produksi'}</span></div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">PIC</div><div style="margin-top:2px">${picNames}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Qty</div><div style="margin-top:2px">${item.qty || 1}</div></div>
            ${item.spec_summary ? `<div style="grid-column:1/-1"><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Spec</div><div style="margin-top:2px">${escapeHtml(item.spec_summary)}</div></div>` : ''}
          </div>
          <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm btn-primary" data-iid="${item.id}" data-pid="${po.id}" onclick="event.stopPropagation();openProduksiItemModal(this.dataset.iid,this.dataset.pid)">Buka Detail</button>
          </div>
        </td>
      </tr>`;

    return `
      <tr class="prod-summary-row" data-iid="${item.id}" onclick="toggleProdRow('${item.id}')" style="cursor:pointer">
        <td class="mono" style="font-weight:500;color:var(--accent)">${po.no_project || po.no_po}</td>
        <td>${po.customer_name || '—'}</td>
        <td>${itemLabel}</td>
        <td style="text-align:center;color:var(--text3);width:30px">${arrow}</td>
      </tr>
      ${detailRow}`;
  }).join('');

  return { rows, count: filtered.length };
}

function toggleProdRow(itemId) {
  _prodExpandedId = (_prodExpandedId === itemId) ? null : itemId;
  refresh_prod();
}

function renderProduksiList() {
  const me = currentUser;
  const tasks = [];
  for(const p of allPOs) {
    for(const it of (p.po_items||[]).filter(x=>x.is_produksi)) {
      const isMyPic = (p.po_pic||[]).some(x => x.item_id===it.id && x.stage==='Produksi' && x.user_id===me.id);
      if(can('po_manage') || isMyPic) {
        if(it.item_status !== 'Selesai Produksi') {
          tasks.push({po:p, item:it});
        }
      }
    }
  }
  _prodCache = tasks;

  const st = tblState('prod');
  const tbl = _buildProdTable(tasks);

  document.getElementById('produksiBody').innerHTML = `
    <div class="toolbar-row">
      <div class="search-wrap" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;display:flex;align-items:center;gap:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" placeholder="Cari No. PO, customer, model, SN, status..." value="${st.search}" oninput="onProdSearchInput(event)" style="flex:1;border:none;outline:none;background:transparent;font-size:13px;font-family:inherit">
      </div>
      <div id="prodCountMeta" style="font-size:12px;color:var(--text3)">${tasks.length} item aktif${st.search?` · ${tbl.count} cocok`:''}</div>
    </div>
    <div class="table-card">
      <div class="table-wrap">
        <table style="">
          <thead>
            <tr>
              <th style="min-width:90px">No. Project</th>
              <th style="">Customer</th>
              <th style="">Item</th>
              <th style="min-width:30px"></th>
            </tr>
          </thead>
          <tbody data-tbl="prod">${tbl.rows}</tbody>
        </table>
      </div>
    </div>`;
}

function refresh_prod() {
  if (!_prodCache) { renderProduksiList(); return; }
  const tbl = _buildProdTable(_prodCache);
  const tbody = document.querySelector('tbody[data-tbl="prod"]');
  if (tbody) tbody.innerHTML = tbl.rows;
  const meta = document.getElementById('prodCountMeta');
  if (meta) {
    const st = tblState('prod');
    meta.textContent = `${_prodCache.length} item aktif${st.search?` · ${tbl.count} cocok`:''}`;
  }
}

function onProdSearchInput(ev) {
  tblState('prod').search = ev.target.value;
  refresh_prod();
}

async function loadPOs() {

function updateNavBadges() {
  const me = currentUser;
  if (!me) return;

  // ── nbPROD: items produksi assigned ke saya yang belum selesai ──
  let prodCount = 0;
  (allPOs || []).forEach(p => {
    (p.po_items || []).forEach(it => {
      const isMyPic = (p.po_pic || []).some(x => x.item_id === it.id && x.stage === 'Produksi' && x.user_id === me.id);
      const notDone = it.item_status !== 'Selesai Produksi';
      if (isMyPic && notDone && it.is_produksi) prodCount++;
    });
  });
  const nbPROD = document.getElementById('nbPROD');
  if (nbPROD) nbPROD.textContent = prodCount;

  // ── nbETS: items needs_ets yang belum punya SN ──
  let etsCount = 0;
  (allPOs || []).forEach(p => {
    (p.po_items || []).filter(it => it.needs_ets).forEach(it => {
      if (!it.serial_number) etsCount++;
    });
  });
  const nbETS = document.getElementById('nbETS');
  if (nbETS) nbETS.textContent = etsCount;

  // ── nbASSIGN: items produksi/instalasi yang belum di-assign ──
  let assignCount = 0;
  (allPOs || []).forEach(p => {
    if (p.status === 'Selesai') return;
    (p.po_items || []).filter(it => it.is_produksi).forEach(it => {
      const pics = (p.po_pic || []).filter(x => x.item_id === it.id && x.stage === 'Produksi');
      if (pics.length === 0) assignCount++;
    });
  });
  const nbASSIGN = document.getElementById('nbASSIGN');
  if (nbASSIGN) nbASSIGN.textContent = assignCount;

  // ── nbHome: jumlah total tugas pending untuk saya (sum semua card) ──
  const nbHome = document.getElementById('nbHome');
  if (nbHome) nbHome.textContent = prodCount;
}

function renderPOStats() {

  const eng = allPOs.filter(p => p.status === 'Engineering').length;
  const prod = allPOs.filter(p => ['Produksi', 'QC'].includes(p.status)).length;

  const s = id => document.getElementById(id);
  if (s('poActive')) { s('poActive').textContent = active; s('poEng').textContent = eng; s('poProd').textContent = prod; s('poDone').textContent = done; }
}

function initColResize(e, colIdx, colId) {
  e.preventDefault(); e.stopPropagation();
  const col = document.getElementById(colId);
  if (!col) return;
  const rsz = e.target; rsz.classList.add('dragging');
  const startX = e.clientX;
  const startW = col.offsetWidth;
  const onMove = ev => { const w = Math.max(50, startW + ev.clientX - startX); col.style.width = w + 'px'; };
  const onUp = () => { rsz.classList.remove('dragging'); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function sortPO(field) {
  if (poSort.field === field) poSort.dir = poSort.dir === 'asc' ? 'desc' : 'asc';
  else { poSort.field = field; poSort.dir = 'desc'; }
  renderPOTable();
}

function updatePOSortArrows() {
  ['no_project', 'customer_name', 'project_name'].forEach(f => {
    const el = document.getElementById('parr_' + f);
    if (el) el.textContent = (poSort.field === f) ? (poSort.dir === 'asc' ? '▲' : '▼') : '';
  });
}

let _poExpandedId = null;

function renderPOTable() {
  const q = poSearch.toLowerCase();
  let rows = allPOs.filter(p => [p.no_po, p.customer_name, p.project_name, p.no_project].join(' ').toLowerCase().includes(q) && (!poFilter.length || poFilter.includes(p.status)));

  // Default sort: tgl_po desc (terbaru di atas)
  rows.sort((a, b) => {
    const av = a[poSort.field] || '', bv = b[poSort.field] || '';
    if (poSort.field === 'status') { return (PO_STATUS_ORDER.indexOf(av) - PO_STATUS_ORDER.indexOf(bv)) * (poSort.dir === 'asc' ? 1 : -1); }
    return av.localeCompare(bv) * (poSort.dir === 'asc' ? 1 : -1);
  });

  const tbody = document.getElementById('poTableBody');
  if (!tbody) return;
  if (!rows.length) { tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text3)">${noData('Belum ada PO')}</td></tr>`; return; }

  tbody.innerHTML = rows.map(p => {
    const overdue = p.tgl_target_kirim && p.tgl_target_kirim < today() && p.status !== 'Selesai';
    const isExpanded = _poExpandedId === p.id;

    const detailRow = !isExpanded ? '' : `
      <tr class="po-detail-row">
        <td colspan="4" style="background:#f8fafc;padding:14px 16px;border-top:none">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;font-size:12px">
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">No. PO</div><div class="mono" style="margin-top:2px;font-weight:500">${p.no_po}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Tgl PO</div><div style="margin-top:2px;font-weight:500">${fmtDate(p.tgl_po)}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Target Kirim</div><div style="margin-top:2px;color:${overdue ? 'var(--red)' : 'inherit'}">${fmtDate(p.tgl_target_kirim)}${overdue ? ' ⚠' : ''}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Status</div><div style="margin-top:2px"><span class="po-status-badge">${p.status || '—'}</span></div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Jumlah Item</div><div style="margin-top:2px;font-weight:500">${itemCount}</div></div>

          </div>

async function uploadPODoc(poId, docType, isRestricted, input) {
  for (const f of Array.from(input.files)) {
    const path = `${poId}/${docType.replace(/\s/g, '_')}/${Date.now()}_${f.name}`;
    const { error } = await sb.storage.from('po-docs').upload(path, f);
    if (!error) {
      await sb.from('po_docs').insert({ po_id: poId, doc_type: docType, file_name: f.name, file_path: path, file_size: f.size, is_restricted: isRestricted, uploaded_by: currentUser.id });
      await logPO(poId, 'Upload Dokumen', docType + ': ' + f.name);
      toast(f.name + ' diupload');
    } else toast('Gagal: ' + f.name);
  }
  input.value = '';
  await checkDocTrigger(poId, docType);
  await loadPOs();
  openPODetail(poId);
}

async function deletePODoc(docId, filePath, fileName) {
  if (!confirm('Hapus dokumen "' + fileName + '"?')) return;
  await sb.storage.from('po-docs').remove([filePath]);
  await sb.from('po_docs').delete().eq('id', docId);
  const poId = filePath.split('/')[0];
  await logPO(poId, 'Hapus Dokumen', fileName);
  toast('Dokumen dihapus');
  await loadPOs();
  openPODetail(poId);
}

async function manualUpdatePOStatus(poId) {
  const sel = document.getElementById('poStatusSelect_' + poId);
  if (!sel) return;
  const newStatus = sel.value;
  await sb.from('purchase_orders').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', poId);
  await logPO(poId, 'Status Berubah', '→ ' + newStatus);
  toast('Status → ' + newStatus);
  await loadPOs();
  openPODetail(poId);
}

// DOC TRIGGER
const DOC_TRIGGERS = {
  'File PO': { nextStatus: 'Engineering', currentStatus: 'Terima PO' },
  'Drawing Approved': { nextStatus: 'Produksi', currentStatus: 'Engineering', requireAlso: 'Approval Drawing' },
  'Routine Test Report': { nextStatus: null, currentStatus: 'QC' },
  'FAT Report': { nextStatus: 'Pengiriman', currentStatus: 'FAT' },
  'Surat Jalan': { nextStatus: null, currentStatus: 'Pengiriman' },
  'SAT': { nextStatus: null, currentStatus: 'Instalasi' },
  'BAST': { nextStatus: 'Selesai', currentStatus: 'Commissioning' },
};

async function checkDocTrigger(poId, docType) {
  const trigger = DOC_TRIGGERS[docType];
  if (!trigger) return;
  const { data: p } = await sb.from('purchase_orders').select('*,po_docs(*)').eq('id', poId).single();
  if (!p) return;
  const curIdx = PO_STATUS_ORDER.indexOf(p.status);
  const trigIdx = PO_STATUS_ORDER.indexOf(trigger.currentStatus);
  if (curIdx > trigIdx) return;
  if (trigger.requireAlso) {
    const docs = p.po_docs || [];
    if (!docs.some(d => d.doc_type === trigger.requireAlso)) { toast('Upload ' + trigger.requireAlso + ' terlebih dahulu'); return; }
  }
  let nextStatus = trigger.nextStatus;
  if (!nextStatus) {
    if (docType === 'Routine Test Report') nextStatus = p.has_fat ? 'FAT' : 'Pengiriman';
    else if (docType === 'Surat Jalan') nextStatus = p.has_instalasi ? 'Instalasi' : (p.has_commissioning ? 'Commissioning' : 'Selesai');
    else if (docType === 'SAT') nextStatus = p.has_commissioning ? 'Commissioning' : 'Selesai';
  }
  if (!nextStatus) return;
  if (confirm(`Dokumen "${docType}" diupload.\nPindah status ke "${nextStatus}"?`)) {
    await sb.from('purchase_orders').update({ status: nextStatus, updated_at: new Date().toISOString() }).eq('id', poId);
    await logPO(poId, 'Status Otomatis', '→ ' + nextStatus + ' (via upload ' + docType + ')');
    toast('Status → ' + nextStatus);
  }
}

async function logPO(poId, action, detail) {
  await sb.from('po_logs').insert({ po_id: poId, action, detail, user_id: currentUser.id });
}

async function deletePO(id) {
  if (!confirm('Hapus PO ini? Semua data terkait akan dihapus.')) return;
  const p = allPOs.find(x => x.id === id);
  const docs = p?.po_docs || [];
  if (docs.length) await sb.storage.from('po-docs').remove(docs.map(d => d.file_path));
  await sb.from('purchase_orders').delete().eq('id', id);
  closeAllModals();
  toast('PO dihapus');
  await loadPOs();
}

async function savePO(editId) {
  const btn = document.getElementById('btnSavePO');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const payload = {
      no_po: gv('pfNoPO').trim(), tgl_po: gv('pfTglPO'), customer_name: gv('pfCustomer').trim(),
      project_name: gv('pfProject').trim() || null, tgl_target_kirim: gv('pfTglKirim') || null,
      no_project: gv('pfNoProject').trim() || null, nilai_po: gv('pfNilai').replace(/[^0-9.]/g, '') || null,
      has_fat: document.getElementById('pfFAT').checked, has_instalasi: document.getElementById('pfInstalasi').checked,
      has_commissioning: document.getElementById('pfCommissioning').checked,
      pp_request_id: gv('pfLinkedPP') || null, catatan: gv('pfCatatan').trim() || null,
      updated_at: new Date().toISOString()
    };
    let poId;
    if (editId) {
      await sb.from('purchase_orders').update(payload).eq('id', editId);
      poId = editId;
      await logPO(poId, 'Edit PO', 'Data PO diperbarui');
    } else {
      const { data } = await sb.from('purchase_orders').insert({ ...payload, created_by: currentUser.id }).select().single();
      poId = data.id;
      await logPO(poId, 'PO Dibuat', payload.no_po);
    }
    // Save items
    if (!editId) {
      const itemRows = [];
      for (let i = 0; i < poFormItems.length; i++) {
        const it = poFormItems[i];
        if (!it.category) continue;
        const { data: inserted } = await sb.from('po_items').insert({
          po_id: poId, category: it.category, model_name: it.model_name || null,
          spec_summary: it.spec_summary || null, qty: it.qty,
          is_produksi: it.is_produksi, needs_ets: it.needs_ets !== false
        }).select('id').single();
        itemRows.push({ idx: i, id: inserted?.id, category: it.category });
      }
      // Persist poFormSpecs ke tabel item_specs (regresi: bagian ini hilang waktu refactor).
      // Spec terstruktur ini dipakai untuk Generate SN di modal Assign Produksi.
      const SPEC_DB_COLS = ['input_fase','input_voltage','output_voltage','output_current','output_kva','output_fase'];
      const specRows = [];
      for (const row of itemRows) {
        const spec = poFormSpecs[row.idx];
        if (spec && row.id) {
          const dbRow = { item_id: row.id, kategori: row.category, updated_at: new Date().toISOString() };
          const extras = {};
          Object.keys(spec).forEach(k => {
            if (SPEC_DB_COLS.includes(k)) dbRow[k] = spec[k];
            else if (spec[k] != null && spec[k] !== '') extras[k] = spec[k];
          });
          if (Object.keys(extras).length) dbRow.extra_specs = extras;
          specRows.push(dbRow);
        }
      }
      if (specRows.length) {
        const { error: _specErr } = await sb.from('item_specs').insert(specRows);
        if (_specErr) console.error('Spec insert error:', _specErr);
      }
      poFormSpecs = {};
    }
    toast(editId ? 'PO diperbarui' : 'PO dibuat');
    closeAllModals();
    await loadPOs();
    if (poId) openPODetail(poId);
  } catch (e) { toast('Error: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Simpan PO';
}

function openItemSpecFromForm(idx){
  const it = poFormItems[idx];
  if(!it) return;
  const cat = it.category;
  _specFormCtx = {idx, category: cat};
  const existing = poFormSpecs[idx]||{};
  const specHtml = '<div class="modal modal-sm">'
    +'<div class="modal-header"><div><h2>Spesifikasi Item</h2><div style="font-size:12px;color:var(--text3);margin-top:2px">'+cat+'</div></div><button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'specModal\').remove()">&#x2715;</button></div>'

    +'<div class="modal-footer"><button class="btn" onclick="document.getElementById(\'specModal\').remove()">Batal</button><button class="btn btn-primary" onclick="saveItemSpecFromForm()">Simpan Spec</button></div>'
    +'</div>';
  openModal(specHtml, 'specModal', true);
}

function buildSpecSummary(cat, spec){
  const v=f=>spec[f]||'';
  if(cat==='Rectifier') return (v('input_fase')+'ph, '+v('input_voltage')+'VAC → '+v('output_voltage')+'VDC '+v('output_current')+'A').replace(/\s+/g,' ').trim();
  if(cat==='UPS') return (v('input_fase')+'ph/'+v('output_fase')+'ph, '+v('output_kva')+'kVA, '+v('input_voltage')+'VAC').replace(/\s+/g,' ').trim();
  if(cat==='Inverter') return (v('dc_input_voltage')+'VDC → '+v('output_voltage')+'VAC '+v('output_kva')+'kVA').replace(/\s+/g,' ').trim();
  if(cat==='Panel ACDB') return ('ACDB '+v('input_fase')+'ph '+v('input_voltage')+'VAC '+v('output_current')+'A').replace(/\s+/g,' ').trim();
  if(cat==='Panel DCDB') return ('DCDB '+v('input_voltage')+'VDC '+v('output_current')+'A').replace(/\s+/g,' ').trim();
  return '';
}

function saveItemSpecFromForm(){
  const {idx, category} = _specFormCtx;
  const fields = SPEC_FIELDS[category]||[];
  const data = {kategori: category};
  fields.forEach(f=>{ const el=document.getElementById('spec_'+f.id); if(el) data[f.id]=el.value.trim()||null; });
  poFormSpecs[idx] = data;
  const modelName = buildModelName(category, data);
  if(modelName) poFormItems[idx].model_name = modelName;
  const specSummary = buildSpecSummary(category, data);
  if(specSummary) poFormItems[idx].spec_summary = specSummary;
  toast('Spec disimpan');
  closeModal('specModal');
  renderPOItems();
}

async function openDetailSpecModal(itemId, poId) {
  const po = allPOs.find(x=>x.id===poId);
  const item = po?.po_items?.find(i=>i.id===itemId);
  if(!item) return;

  // Load existing detail spec
  let ds = null; try { const r = await sb.from('item_detail_specs').select('*').eq('item_id', itemId).single(); ds = r.data; } catch(e) { ds = {}; }
  const spec = ds || {};
  const cat = item.category;

  // Load autocomplete data from previous specs
  let prevSpecs = []; try { const r = await sb.from('item_detail_specs').select('*').limit(50); prevSpecs = r.data || []; } catch(e) { prevSpecs = []; }
  const prev = prevSpecs || [];

  // Build autocomplete suggestions per field
  const suggestions = {};
  const acFields = ['r_input_voltage','r_output_voltage','r_output_current','r_voltage_adjustable',
    'u_rect_input_voltage','u_dc_bus_voltage','u_dc_bus_current','u_inv_output_voltage',
    'u_capacity_kva','u_capacity_kw','i_capacity_kva','i_capacity_kw',
    'i_input_voltage','i_output_voltage','i_topology',
    'p_input_voltage','p_current_rating','p_feeder_count','p_feeder_rating','custom_notes'];
  acFields.forEach(f => {
    suggestions[f] = [...new Set(prev.map(p=>p[f]).filter(Boolean))];
  });

  window._dsItemId = itemId;
  window._dsSuggestions = suggestions;

  function sel(id, opts, val, placeholder='') {
    return '<select id="ds_'+id+'" style="padding:6px 8px;border:1px solid var(--border);border-radius:var(--r-sm)">'
      + (placeholder?'<option value="">'+placeholder+'</option>':'')
      + opts.map(o=>'<option value="'+o+'"'+(val===o?' selected':'')+'>'+o+'</option>').join('')
      + '</select>';
  }

  function inp(id, val, placeholder='', unit='') {
    const sugg = (suggestions[id]||[]);
    const listId = 'list_'+id;
    if(unit) {
      let html = '<div style="display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden">'
        + '<input type="text" id="ds_'+id+'" value="'+(val||'')+'" placeholder="'+placeholder+'" '
        + 'style="flex:1;padding:6px 8px;border:none;outline:none;background:transparent" '
        + (sugg.length?'list="'+listId+'"':'') + '>'
        + '<span style="padding:6px 10px;background:var(--surface2);color:var(--text2);font-size:13px;border-left:1px solid var(--border)">'+unit+'</span>'
        + '</div>';
      if(sugg.length) html += '<datalist id="'+listId+'">'+sugg.map(s=>'<option value="'+s+'">').join('')+'</datalist>';
      return html;
    }
    let html = '<input type="text" id="ds_'+id+'" value="'+(val||'')+'" placeholder="'+placeholder+'" '
      + 'style="padding:6px 8px;border:1px solid var(--border);border-radius:var(--r-sm)" '
      + (sugg.length?'list="'+listId+'"':'') + '>';
    if(sugg.length) html += '<datalist id="'+listId+'">'+sugg.map(s=>'<option value="'+s+'">').join('')+'</datalist>';
    return html;

function dsRenderFiles(spec) {
  ['photos','doc_drawing_approval','doc_asbuilt','doc_fat'].forEach(key => {
    const el = document.getElementById('ds_'+key+'_list');
    if(!el) return;
    const files = spec[key] || [];
    el.innerHTML = files.length
      ? files.map((f,i)=>'<div style="font-size:11px;padding:3px 0;display:flex;align-items:center;gap:6px"><a href="'+f.url+'" target="_blank" style="color:var(--blue);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+f.name+'</a></div>').join('')
      : '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Belum ada</div>';
  });
}

function dsUpload(field, itemId) {
  document.getElementById('ds_'+field+'_input').click();
}

async function dsHandleUpload(field, itemId, input) {
  const files = Array.from(input.files);
  let existing = {}; try { const r = await sb.from('item_detail_specs').select(field).eq('item_id', itemId).single(); existing = r.data||{}; } catch(e) {}
  const arr = existing?.[field] || [];
  for(const f of files) {
    const path = 'item-docs/'+itemId+'/'+field+'/'+Date.now()+'_'+f.name;
    const {error} = await sb.storage.from('item-docs').upload(path, f);
    if(!error) {
      const url = SB_URL+'/storage/v1/object/public/item-docs/'+path;
      arr.push({name: f.name, url, path});
      toast(f.name+' diupload');
    } else toast('Gagal: '+f.name);
  }
  const update = {};
  update[field] = arr;
  await sb.from('item_detail_specs').upsert({item_id: itemId, ...update}, {onConflict:'item_id'});
  input.value = '';
  try { const r = await sb.from('item_detail_specs').select('*').eq('item_id',itemId).single(); dsRenderFiles(r.data||{}); } catch(e) { dsRenderFiles({}); }
}

function gvds(id) {
  const el = document.getElementById('ds_'+id);
  return el ? el.value.trim() : null;
}

async function saveDetailSpec(itemId, poId) {
  const po = allPOs.find(x=>x.id===poId);
  const item = po?.po_items?.find(i=>i.id===itemId);
  const cat = item?.category;

  const data = {
    item_id: itemId,
    brand: gvds('brand'),
    ip_protection: gvds('ip_protection'),
    colour: gvds('colour'),
    cable_entry: gvds('cable_entry'),
    custom_notes: gvds('custom_notes'),
    updated_at: new Date().toISOString()
  };

  if(cat === 'Rectifier') {
    Object.assign(data, {
      r_parallel_input: document.getElementById('ds_r_parallel_input')?.checked || false,
      r_input_voltage: gvds('r_input_voltage'),
      r_input_phase: gvds('r_input_phase'),
      r_pulse: gvds('r_pulse'),
      r_output_voltage: gvds('r_output_voltage'),
      r_output_current: gvds('r_output_current'),
      r_voltage_adjustable: gvds('r_voltage_adjustable'),
    });
    // Auto power factor based on pulse
    const pulse = parseInt(data.r_pulse||'6');
    data.r_power_factor = pulse >= 12 ? '>0.9' : pulse === 6 ? '>0.8' : '>0.7';
  } else if(cat === 'UPS') {
    Object.assign(data, {
      u_capacity_kva: gvds('u_capacity_kva'),
      u_capacity_kw: gvds('u_capacity_kw'),
      u_rect_input_voltage: gvds('u_rect_input_voltage'),
      u_rect_input_phase: gvds('u_rect_input_phase'),
      u_dc_bus_voltage: gvds('u_dc_bus_voltage'),
      u_dc_bus_current: gvds('u_dc_bus_current'),
      u_inv_output_voltage: gvds('u_inv_output_voltage'),
      u_inv_output_phase: gvds('u_inv_output_phase'),
      u_bypass_voltage: gvds('u_bypass_voltage'),
    });
  } else if(cat === 'Inverter') {
    Object.assign(data, {
      i_capacity_kva: gvds('i_capacity_kva'),
      i_capacity_kw: gvds('i_capacity_kw'),
      i_input_voltage: gvds('i_input_voltage'),
      i_input_tolerance: gvds('i_input_tolerance'),
      i_output_voltage: gvds('i_output_voltage'),
      i_output_phase: gvds('i_output_phase'),
      i_topology: gvds('i_topology'),
    });
  } else if(cat === 'Panel ACDB' || cat === 'Panel DCDB') {
    Object.assign(data, {
      p_input_voltage: gvds('p_input_voltage'),
      p_input_phase: gvds('p_input_phase'),
      p_current_rating: gvds('p_current_rating'),
      p_feeder_count: gvds('p_feeder_count'),
      p_feeder_rating: gvds('p_feeder_rating'),
    });
  }

  const {error} = await sb.from('item_detail_specs').upsert(data, {onConflict:'item_id'});
  if(error) { toast('Error: '+error.message); return; }
  toast('Detail spec disimpan');
  closeAllModals();
  await loadPOs();
  openPODetail(poId);
}

  if (pkId) { await sb.from('po_pk').update(payload).eq('id', pkId); }
  else { await sb.from('po_pk').insert({ ...payload, id: genId('PK'), po_id: poId, status: 'Diajukan', created_by: currentUser.id }); await logPO(poId, 'PK Diajukan', kep + ' — ' + fmtRp(parseFloat(nilai))); }

  if (status === 'Disetujui') upd.tgl_approval = today();
  if (['Realisasi','Selesai'].includes(status)) {
    const nr = gv('pkNilaiReal').replace(/[^0-9.]/g,'');
    if (nr) upd.nilai_realisasi = parseFloat(nr);
    upd.tgl_realisasi = gv('pkTglReal') || today();
  }
  await sb.from('po_pk').update(upd).eq('id', pkId);
  await logPO(poId, 'PK Update', '→ ' + status);
  toast('Status PK → ' + status);
  closeAllModals();
  await loadPOs();
  openPODetail(poId);
}

async function openGenSerialModal(poId) {
  const p = allPOs.find(x => x.id === poId);
  const items = (p?.po_items || []).filter(it => it.needs_ets && SPEC_CATEGORIES.includes(it.category) && !it.serial_number);
  if (!items.length) { toast('Tidak ada item yang perlu generate SN'); return; }
  openModal(`<div class="modal modal-sm">
    <div class="modal-header"><h2>Generate Serial Number</h2><button class="btn btn-ghost btn-sm" onclick="closeAllModals()">&#x2715;</button></div>
    <div class="modal-body">
      <div class="form-row"><label>Tanggal Produksi <span class="req">*</span></label><input type="date" id="snProdDate" value="${today()}"></div>
      <div style="margin-top:.875rem;font-size:13px;color:var(--text2)">Item yang akan di-generate (${items.length}):</div>
      ${items.map(it => `<div class="item-card" style="margin-top:6px"><span style="font-size:13px;font-weight:600">${it.category}</span>${it.model_name ? '<span style="font-size:12px;color:var(--text3)"> — ' + it.model_name + '</span>' : ''}</div>`).join('')}
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAllModals()">Batal</button>
      <button class="btn btn-primary" onclick="doGenerateSerials('${poId}')">Generate</button>
    </div>
  </div>`);
}

async function doGenerateSerials(poId) {
  const prodDate = gv('snProdDate');
  if (!prodDate) { toast('Pilih tanggal produksi'); return; }
  const p = allPOs.find(x => x.id === poId);
  const items = (p?.po_items || []).filter(it => it.needs_ets && SPEC_CATEGORIES.includes(it.category) && !it.serial_number);
  const dateObj = new Date(prodDate);
  let generated = 0, skipped = 0;
  for (const it of items) {
    let spec = null; try { const _r = await sb.from('item_specs').select('*').eq('item_id', it.id).single(); spec = _r.data; } catch(e) {}
    if (!spec) { skipped++; continue; }
    const { data: counter } = await sb.from('serial_counter').select('*').eq('id', 1).single();
    let { huruf, angka } = counter;
    const sn = buildSerialNumberFromSpec(spec, p.no_project, huruf, angka, dateObj);
    if (!sn) { skipped++; continue; }
    angka++;
    if (angka > 999) { angka = 1; huruf = String.fromCharCode(huruf.charCodeAt(0) + 1); }
    await sb.from('serial_counter').update({ huruf, angka }).eq('id', 1);
    await sb.from('po_items').update({ serial_number: sn, serial_generated_at: new Date().toISOString() }).eq('id', it.id);
    generated++;
  }
  await logPO(poId, 'Generate Serial', generated + ' item' + (skipped ? ', ' + skipped + ' item skip (belum ada spec)' : ''));
  toast(generated + ' SN di-generate' + (skipped ? ', ' + skipped + ' skip (isi spec dulu)' : ''));
  closeAllModals();
  await loadPOs();
  openPODetail(poId);
}

async function loadDownloadFilesPO(poId){
  const po = allPOs.find(x=>x.id===poId);
  const files = po?.download_files || [];
  const el = document.getElementById('dlFileListPO_'+poId);
  if(!el) return;
  el.innerHTML = files.length ? files.map((f,i)=>`
    <div class="file-item">
      <span class="fname" style="cursor:default;text-decoration:none;color:var(--text)">${f.name}</span>
      <div class="file-actions" style="opacity:1">
        <button class="file-act-btn del" data-pid="${poId}" data-idx="${i}" onclick="removeDownloadFilePO(this.dataset.pid,parseInt(this.dataset.idx))">🗑</button>
      </div>
    </div>`).join('') : '<div style="font-size:12px;color:var(--text3)">Belum ada file</div>';
}

async function uploadDownloadFilePO(poId, input){
  const files = Array.from(input.files);
  const {data:po} = await sb.from('purchase_orders').select('download_files').eq('id',poId).single();
  const existing = po?.download_files || [];
  for(const f of files){
    const path = 'downloads/po/'+poId+'/'+Date.now()+'_'+f.name;
    const {error} = await sb.storage.from('po-docs').upload(path, f);
    if(!error){
      const url = SB_URL+'/storage/v1/object/public/po-docs/'+path;
      existing.push({name:f.name, url, path});
      toast(f.name+' diupload');
    } else toast('Gagal: '+f.name);
  }
  await sb.from('purchase_orders').update({download_files: existing}).eq('id',poId);
  input.value='';
  await loadPOs();
  loadDownloadFilesPO(poId);
}

async function removeDownloadFilePO(poId, idx){
  const {data:po} = await sb.from('purchase_orders').select('download_files').eq('id',poId).single();
  const files = po?.download_files || [];
  if(files[idx]?.path) await sb.storage.from('po-docs').remove([files[idx].path]);
  files.splice(idx,1);
  await sb.from('purchase_orders').update({download_files: files}).eq('id',poId);
  await loadPOs();
  loadDownloadFilesPO(poId);
  toast('File dihapus');
}

async function updateInstStatus(newStatus) {
  const {task} = window._instCurrent;
  const now = new Date().toISOString();
  task.status = newStatus;
  const updates = {status: newStatus, updated_at: now};
  if(newStatus === 'Berangkat' && !task.berangkat_at) { updates.berangkat_at = now; task.berangkat_at = now; }
  else if(newStatus === 'Di Lokasi' && !task.di_lokasi_at) { updates.di_lokasi_at = now; task.di_lokasi_at = now; }
  else if(newStatus === 'Selesai' && !task.inst_selesai_at) { updates.inst_selesai_at = now; task.inst_selesai_at = now; }
  renderInstStatus();
  toast('Status diperbarui');
  await sb.from('instalasi_tasks').update(updates).eq('id',task.id);
}

async function saveInstDetails() {
  const {task, po} = window._instCurrent;
  const tglMulai = gv('instTglMulai')||null;
  const tglSelesai = gv('instTglSelesai')||null;
  const catatan = gv('instCatatan')||null;
  await sb.from('instalasi_tasks').update({tgl_mulai:tglMulai, tgl_selesai:tglSelesai, catatan, updated_at:new Date().toISOString()}).eq('id',task.id);
  task.tgl_mulai = tglMulai;
  task.tgl_selesai = tglSelesai;
  task.catatan = catatan;
  toast('Detail tersimpan');

async function savePKDinas() {
  const tujuan = gv('pkTujuan').trim();
  if(!tujuan) { toast('Tujuan wajib diisi'); return; }
  const {task} = window._instCurrent;
  const me = currentUser;
  const personel = Array.from(document.querySelectorAll('.pkPersCb:checked')).map(cb=>cb.value);
  
  const transport = parseFloat(gv('pkTransport'))||0;
  const akomodasi = parseFloat(gv('pkAkomodasi'))||0;
  const harian = parseFloat(gv('pkHarian'))||0;
  const lain = parseFloat(gv('pkLain'))||0;
  const total = transport + akomodasi + harian + lain;

  await sb.from('pk_dinas').insert({
    task_id: task.id,
    pengaju_id: me.id,
    tujuan,
    tgl_berangkat: gv('pkBerangkat')||null,
    tgl_pulang: gv('pkPulang')||null,
    personel,
    biaya_transport: transport,
    biaya_akomodasi: akomodasi,
    uang_harian: harian,
    biaya_lain: lain,
    total_pengajuan: total,
    catatan_pengajuan: gv('pkCatatan')||null,
    status: 'Pengajuan'
  });

  toast('Pengajuan PK Dinas tersimpan');
  closeTopModal();
  await renderInstPK();
}

async function saveSAT() {
  const {task} = window._instCurrent;
  const me = currentUser;

  toast('Mengupload...');
  
  const docs = [];
  for(const f of Array.from(document.getElementById('satDocs').files)) {
    const path = `sat/${task.id}/${Date.now()}_${f.name}`.replace(/\s/g,'_');
    const {error} = await sb.storage.from('service-docs').upload(path, f);
    if(!error) docs.push({name:f.name, url:SB_URL+'/storage/v1/object/public/service-docs/'+path, path});
  }
  
  const photos = [];
  for(const f of Array.from(document.getElementById('satPhotos').files).slice(0,10)) {
    const path = `sat/${task.id}/photo_${Date.now()}_${f.name}`.replace(/\s/g,'_');
    const {error} = await sb.storage.from('service-docs').upload(path, f);
    if(!error) photos.push({name:f.name, url:SB_URL+'/storage/v1/object/public/service-docs/'+path, path});
  }

  const signName = gv('satSignName').trim();
  await sb.from('sat_reports').insert({
    task_id: task.id,
    user_id: me.id,
    judul: gv('satJudul')||null,
    tanggal_test: gv('satTanggal')||null,
    hasil: gv('satHasil')||null,
    catatan: gv('satCatatan')||null,
    signed_by_customer: signName||null,
    signed_position: gv('satSignPos')||null,
    signed_at: signName?new Date().toISOString():null,
    documents: docs,
    photos
  });

  toast('Laporan SAT tersimpan');
  closeTopModal();
  await renderInstSAT();
}

async function saveBAST() {
  const {task} = window._instCurrent;
  const me = currentUser;

  toast('Mengupload...');
  
  const docs = [];
  for(const f of Array.from(document.getElementById('bastDocs').files)) {
    const path = `bast/${task.id}/${Date.now()}_${f.name}`.replace(/\s/g,'_');
    const {error} = await sb.storage.from('service-docs').upload(path, f);
    if(!error) docs.push({name:f.name, url:SB_URL+'/storage/v1/object/public/service-docs/'+path, path});
  }
  
  const photos = [];
  for(const f of Array.from(document.getElementById('bastPhotos').files).slice(0,10)) {
    const path = `bast/${task.id}/photo_${Date.now()}_${f.name}`.replace(/\s/g,'_');
    const {error} = await sb.storage.from('service-docs').upload(path, f);
    if(!error) photos.push({name:f.name, url:SB_URL+'/storage/v1/object/public/service-docs/'+path, path});
  }

  await sb.from('bast_records').insert({
    task_id: task.id,
    user_id: me.id,
    no_bast: gv('bastNo')||null,
    tanggal: gv('bastTgl')||null,
    penyerah_nama: gv('bastPyName')||null,
    penyerah_jabatan: gv('bastPyPos')||null,
    penerima_nama: gv('bastPnName')||null,
    penerima_jabatan: gv('bastPnPos')||null,
    penerima_perusahaan: gv('bastPnPerusahaan')||null,
    catatan: gv('bastCatatan')||null,
    documents: docs,
    photos
  });

  toast('BAST tersimpan');
  closeTopModal();
  await renderInstBAST();
}



async function loadServices() {
  const { data } = await sb.from('service_tickets').select('*,service_logs(*),service_docs(*),app_users!service_tickets_pic_id_fkey(id,full_name)').order('created_at', { ascending: false });
  allServices = data || [];
  renderSvcStats();
  renderSvcTable();
  const nbSVC = document.getElementById('nbSVC');
  if (nbSVC) nbSVC.textContent = allServices.filter(s => s.status !== 'Selesai').length;
}

function renderSvcStats() {
  const total = allServices.length, masuk = allServices.filter(s => s.status === 'Masuk').length, proses = allServices.filter(s => s.status === 'Proses').length, selesai = allServices.filter(s => s.status === 'Selesai').length;
  const el = id => document.getElementById(id);
  if (el('svcTotal')) { el('svcTotal').textContent = total; el('svcMasuk').textContent = masuk; el('svcProses').textContent = proses; el('svcSelesai').textContent = selesai; }
}

function setSvcFilter(status, el) {
  svcFilter = svcFilter === status ? '' : status;
  document.querySelectorAll('#svcStats .stat-card').forEach(c => c.classList.remove('active-filter'));
  if (svcFilter) el.classList.add('active-filter');
  renderSvcTable();
}

let _svcExpandedId = null;

function renderSvcTable() {
  const q = svcSearch.toLowerCase();
  let rows = allServices.filter(s => [s.id, s.customer_name, s.deskripsi_masalah, s.site_location].join(' ').toLowerCase().includes(q) && (!svcFilter || s.status === svcFilter));

  // Sort: created_at desc (terbaru di atas)
  rows.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

  const tbody = document.getElementById('svcTableBody');
  if (!tbody) return;
  if (!rows.length) { tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text3)">${noData('Belum ada tiket service')}</td></tr>`; return; }

  tbody.innerHTML = rows.map(s => {
    const isExpanded = _svcExpandedId === s.id;
    const arrow = isExpanded ? '▲' : '▼';
    const probTrunc = (s.deskripsi_masalah || '').length > 50
      ? s.deskripsi_masalah.substring(0, 50) + '…'
      : s.deskripsi_masalah || '—';

    const detailRow = !isExpanded ? '' : `
      <tr class="svc-detail-row">
        <td colspan="4" style="background:#f8fafc;padding:14px 16px;border-top:none">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;font-size:12px">
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Tgl Laporan</div><div style="margin-top:2px;font-weight:500">${fmtDate(s.tgl_laporan)}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Status</div><div style="margin-top:2px">${badge(s.status)}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">PIC</div><div style="margin-top:2px;font-weight:500">${s.app_users?.full_name || '—'}</div></div>
            <div><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Lokasi</div><div style="margin-top:2px">${s.site_location || '—'}</div></div>
            ${s.unit_info ? `<div style="grid-column:1/-1"><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Unit Info</div><div style="margin-top:2px">${escapeHtml(s.unit_info)}</div></div>` : ''}
            <div style="grid-column:1/-1"><div style="color:var(--text3);font-size:10px;text-transform:uppercase;font-weight:600">Masalah</div><div style="margin-top:2px;line-height:1.5">${escapeHtml(s.deskripsi_masalah || '')}</div></div>
          </div>
          <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm btn-primary" data-sid="${s.id}" onclick="event.stopPropagation();openSvcDetail(this.dataset.sid)">Buka Detail</button>
          </div>
        </td>
      </tr>`;

    return `
      <tr onclick="toggleSvcRow('${s.id}')" style="cursor:pointer">
        <td class="mono" style="font-weight:500">${s.id}</td>
        <td>${s.customer_name || '—'}</td>
        <td style="color:var(--text2)">${probTrunc}</td>
        <td style="text-align:center;color:var(--text3);width:30px">${arrow}</td>
      </tr>
      ${detailRow}`;
  }).join('');
}

function toggleSvcRow(id) {
  _svcExpandedId = (_svcExpandedId === id) ? null : id;
  renderSvcTable();
}

async function updateSvcStatus(id, status) {
  const upd = { status, updated_at: new Date().toISOString() };
  if (status === 'Proses') {
    upd.proses_started_at = new Date().toISOString();
  }
  if (status === 'Selesai') {
    upd.closed_at = new Date().toISOString();
    // Auto-create KB entry
    const { data: ticket } = await sb.from('service_tickets').select('*,service_logs(*)').eq('id', id).single();
    if (ticket) {
      const tahapanList = [...new Set((ticket.service_logs || []).map(l => l.tahapan))];
      await sb.from('kb_entries').insert({ ticket_id: id, judul: ticket.deskripsi_masalah?.substring(0, 100) || 'Service Report', kategori_unit: ticket.unit_info || '', ringkasan_masalah: ticket.deskripsi_masalah, ringkasan_solusi: (ticket.service_logs || []).filter(l => l.is_resolved).map(l => l.hasil).filter(Boolean).join('\n') || null, tahapan_digunakan: tahapanList, created_by: currentUser.id });
    }
  }
  await sb.from('service_tickets').update(upd).eq('id', id);
  toast('Status → ' + status);
  await loadServices();
  openSvcDetail(id);
}

async function saveSvcTicket(editId) {
  const customer = gv('svcCustomer').trim(), date = gv('svcDate'), desc = gv('svcDesc').trim(), pic = gv('svcPIC');
  if (!customer || !date || !desc || !pic) { toast('Lengkapi field wajib'); return; }
  const payload = { customer_name: customer, tgl_laporan: date, deskripsi_masalah: desc, pic_id: pic, site_location: gv('svcSite').trim() || null, po_item_id: gv('svcUnit') || null, unit_info: gv('svcUnitInfo').trim() || null, updated_at: new Date().toISOString() };
  if (editId) {
    await sb.from('service_tickets').update(payload).eq('id', editId);
    toast('Tiket diperbarui');
  } else {
    const id = genId('SVC');
    await sb.from('service_tickets').insert({ ...payload, id, status: 'Masuk', created_by: currentUser.id });
    toast('Tiket dibuat: ' + id);
  }
  closeAllModals();
  await loadServices();
}

async function saveSvcLog(ticketId) {
  const tahapan = gv('logTahapan'), catatan = gv('logCatatan').trim(), hasil = gv('logHasil').trim();
  if (!tahapan) { toast('Pilih tahapan'); return; }
  const isResolved = document.getElementById('logResolved').checked;
  await sb.from('service_logs').insert({ ticket_id: ticketId, tahapan, catatan: catatan || null, hasil: hasil || null, is_resolved: isResolved, user_id: currentUser.id });
  // Update ticket to Proses if still Masuk
  const ticket = allServices.find(s => s.id === ticketId);
  if (ticket?.status === 'Masuk') await sb.from('service_tickets').update({ status: 'Proses', updated_at: new Date().toISOString() }).eq('id', ticketId);
  toast('Log ditambahkan');
  await loadServices();
  openSvcDetail(ticketId);
}

async function uploadSvcDoc(ticketId, type, input) {
  for (const f of Array.from(input.files)) {
    const path = `${ticketId}/${type}/${Date.now()}_${f.name}`;
    const { error } = await sb.storage.from('service-docs').upload(path, f);
    if (!error) { await sb.from('service_docs').insert({ ticket_id: ticketId, file_name: f.name, file_path: path, file_size: f.size, file_type: type, uploaded_by: currentUser.id }); toast(f.name + ' diupload'); }
    else toast('Gagal: ' + f.name);
  }
  input.value = '';
  await loadServices();
  openSvcDetail(ticketId);
}

async function deleteSvcDoc(docId, filePath, fileName) {
  if (!confirm('Hapus "' + fileName + '"?')) return;
  await sb.storage.from('service-docs').remove([filePath]);
  await sb.from('service_docs').delete().eq('id', docId);
  toast('Dihapus');
  const ticketId = filePath.split('/')[0];
  await loadServices();
  openSvcDetail(ticketId);
}

async function deleteSvcTicket(id) {
  if (!confirm('Hapus tiket ini beserta semua log dan dokumen?')) return;
  const s = allServices.find(x => x.id === id);
  const docs = s?.service_docs || [];
  if (docs.length) await sb.storage.from('service-docs').remove(docs.map(d => d.file_path));
  await sb.from('service_tickets').delete().eq('id', id);
  closeAllModals();
  toast('Tiket dihapus');
  await loadServices();
}

  // Collect custom permissions (only for non-fixed roles)
  const isFixed = ['owner','admin','sales','direktur'].includes(role);

// ── Column Resize (event delegation, berlaku ke semua tabel .table-card) ──
(function setupColumnResize() {
  const STORAGE_KEY = 'panel_col_widths_v1';
  let _resizing = null;
  let _moved = false;

  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveAll(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch (e) { /* ignore quota errors */ }
  }
  // Identifier tabel: id, data-tbl, atau fallback berdasarkan header texts
  function getTableKey(table) {
    if (table.id) return 'id:' + table.id;
    if (table.dataset.tbl) return 'dt:' + table.dataset.tbl;
    const tbody = table.querySelector('tbody[data-tbl]');
    if (tbody?.dataset.tbl) return 'tb:' + tbody.dataset.tbl;
    const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim().substring(0,12)).join('|');
    return 'h:' + headers;
  }
  function applyWidths(table) {
    if (!table.closest('.table-card')) return;
    const key = getTableKey(table);
    const all = loadAll();
    const widths = all[key];
    if (!widths) return;
    table.querySelectorAll('thead th').forEach((th, idx) => {
      const w = widths[idx];
      if (w && w > 30) {
        th.style.width = w + 'px';
        th.style.minWidth = w + 'px';
      }
    });
  }
  function saveWidth(th) {
    const table = th.closest('table');
    if (!table) return;
    const key = getTableKey(table);
    const idx = Array.from(th.parentElement.children).indexOf(th);
    const all = loadAll();
    if (!all[key]) all[key] = {};
    all[key][idx] = th.offsetWidth;
    saveAll(all);
  }

  function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }

  function onStart(e) {
    const x = getX(e);
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const elem = e.touches ? document.elementFromPoint(x, y) : e.target;
    const th = elem?.closest?.('th');
    if (!th) return;
    if (!th.closest('.table-card')) return;
    const rect = th.getBoundingClientRect();
    if (rect.right - x > 8) return;
    e.preventDefault();
    e.stopPropagation();
    _resizing = { th, startX: x, startW: th.offsetWidth };
    _moved = false;
    th.classList.add('col-resizing');
    document.body.classList.add('col-resizing-active');
  }

  function onMove(e) {
    if (!_resizing) return;
    const x = getX(e);
    const delta = x - _resizing.startX;
    if (Math.abs(delta) > 2) _moved = true;
    const newW = Math.max(50, _resizing.startW + delta);
    _resizing.th.style.width = newW + 'px';
    _resizing.th.style.minWidth = newW + 'px';
    if (e.cancelable) e.preventDefault();
  }

  function onEnd() {
    if (!_resizing) return;
    const th = _resizing.th;
    th.classList.remove('col-resizing');
    document.body.classList.remove('col-resizing-active');
    if (_moved) {
      saveWidth(th); // ── PERSIST ──
      // Block next click (cegah trigger sort header)
      const blocker = (ev) => {
        ev.stopPropagation();
        ev.preventDefault();
        document.removeEventListener('click', blocker, true);
      };
      document.addEventListener('click', blocker, true);
      setTimeout(() => document.removeEventListener('click', blocker, true), 50);
    }
    _resizing = null;
  }

  document.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchstart', onStart, { passive: false });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onEnd);

  // ── Auto-apply saved widths saat tabel baru di-render ──
  const observer = new MutationObserver(mutations => {
    const tables = new Set();
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.nodeType !== 1) return;
        if (node.tagName === 'TABLE') tables.add(node);
        node.querySelectorAll?.('table').forEach(t => tables.add(t));
        // Juga deteksi kalau tbody diubah (innerHTML)
        if (node.tagName === 'TBODY' || node.tagName === 'TR') {
          const tbl = node.closest?.('table');
          if (tbl) tables.add(tbl);
        }
      });
    });
    tables.forEach(applyWidths);
  });
  // Mulai observe setelah DOM ready
  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  } else {
    document.addEventListener('DOMContentLoaded', () => {
      observer.observe(document.body, { childList: true, subtree: true });
    });
  }

  // Expose untuk debug / reset (panggil dari console: window.resetColWidths())
  window.resetColWidths = function() {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  };
})();

// ── Helper untuk WA ──
function normalizeWA(raw) {
  if (!raw) return '';
  let n = raw.replace(/[^\d]/g, '');           // buang spasi, tanda baca
  if (n.startsWith('0')) n = '62' + n.slice(1); // 08xx → 628xx
  else if (n.startsWith('8')) n = '62' + n;     // 8xx → 628xx
  else if (n.startsWith('620')) n = '62' + n.slice(3); // 6208xx → 628xx (typo umum)
  // Validasi minimal: 62 + 9 digit
  if (n.length < 11 || !n.startsWith('62')) return '';
  return n;
}

function togglePwVisibility(inputId, btn) {
  const el = document.getElementById(inputId);
  if (!el) return;
  if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
  else { el.type = 'password'; btn.textContent = '👁'; }
}

function generateRandomPw(inputId) {
  // Generate password 8 karakter: 4 huruf + 4 angka, acak posisi
  const huruf = 'abcdefghjkmnpqrstuvwxyz'; // skip i, l, o (bingung sama 1,0)
  const angka = '23456789';                 // skip 0, 1 (bingung sama o, l)
  const chars = [];
  for (let i = 0; i < 4; i++) chars.push(huruf[Math.floor(Math.random()*huruf.length)]);
  for (let i = 0; i < 4; i++) chars.push(angka[Math.floor(Math.random()*angka.length)]);
  // Shuffle
  chars.sort(() => Math.random() - 0.5);
  const el = document.getElementById(inputId);
  if (el) { el.value = chars.join(''); el.type = 'text'; }
}

function copyCredential(encodedMsg) {
  const text = decodeURIComponent(encodedMsg);
  navigator.clipboard.writeText(text).then(() => toast('✓ Pesan tersalin ke clipboard'))
    .catch(() => {
      // Fallback untuk browser lama
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('✓ Pesan tersalin'); }
      catch(e) { toast('Browser tidak mendukung copy otomatis'); }
      document.body.removeChild(ta);
    });
}

const SPEC_CATEGORIES = Object.keys(SPEC_FIELDS);
const MONTH_CODES = ['A','B','C','D','E','F','G','H','I','J','K','L'];
function yearCode(y){ return String.fromCharCode(65 + (y - 2025)); }
function monthCode(m){ return MONTH_CODES[m-1]||'A'; }
function voltageCode(v){ const map={'24':'24','48':'48','110':'11','220':'22','380':'38','400':'40'}; return map[String(v)]||String(v).slice(0,2); }
function ratingCode(r){ const n=parseFloat(r)||0; if(n<10) return String(Math.round(n*10)).padStart(2,'0'); return String(Math.round(n)).padStart(2,'0').slice(-2); }

function buildSerialNumberFromSpec(spec, noProject, huruf, angka, prodDate){
  const y=yearCode(prodDate.getFullYear());
  const m=monthCode(prodDate.getMonth()+1);
  const proj=(noProject||'').replace(/[^0-9]/g,'').slice(-3).padStart(3,'0');
  const angkaStr=String(angka).padStart(3,'0');
  const cat=spec.kategori;
  if(cat==='Rectifier'){
    const fase=spec.input_fase||'1';
    const pulse=(spec.pulse||'6').padStart(2,'0');
    const vout=voltageCode(spec.output_voltage||'');
    const rout=ratingCode(spec.output_current||'');
    return 'R'+y+m+fase+pulse+vout+rout+proj+huruf+angkaStr;
  } else if(cat==='UPS'){
    const fase=spec.input_fase||'1';
    const vout=voltageCode(spec.output_voltage||'');
    const rout=ratingCode(spec.output_kva||'');
    return 'U'+y+m+fase+'06'+vout+rout+proj+huruf+angkaStr;
  } else if(cat==='Inverter'){
    const dcin=voltageCode(spec.dc_input_voltage||'');
    const vout=voltageCode(spec.output_voltage||'');
    const rout=ratingCode(spec.output_kva||'');
    return 'I'+y+m+dcin+vout+rout+proj+huruf+angkaStr;
  } else if(cat==='Panel DCDB'||cat==='DCDB'){
    return 'D'+y+m+proj+huruf+angkaStr;
  } else if(cat==='Panel ACDB'||cat==='ACDB'){
    return 'A'+y+m+proj+huruf+angkaStr;
  }
  return null;
}

function renderSpecForm(category, values){
  const fields = SPEC_FIELDS[category];
  if(!fields) return '<div style="color:var(--text3);font-size:13px">Spec tidak tersedia untuk kategori ini.</div>';
  let html = '<div class="form-grid">';
  fields.forEach(f=>{
    const val = values[f.id]||'';
    if(f.type==='select'){
      const opts = f.options.map(o=>'<option value="'+o+'"'+(val==o?' selected':'')+'>'+o+'</option>').join('');
      html += '<div class="form-row"><label>'+f.label+'</label><select id="spec_'+f.id+'" style="padding:6px 8px">'+opts+'</select></div>';
    } else if(f.type==='textarea'){
      html += '<div class="form-row" style="grid-column:1/-1"><label>'+f.label+'</label><textarea id="spec_'+f.id+'" placeholder="'+(f.placeholder||'')+'" rows="2">'+val+'</textarea></div>';
    } else {
      html += '<div class="form-row"><label>'+f.label+'</label><input type="text" id="spec_'+f.id+'" value="'+val+'" placeholder="'+(f.placeholder||'')+'"></div>';
    }
  });
  html += '</div>';
  return html;
}

function buildModelName(cat, spec){
  const v=f=>spec[f]||'';
  if(cat==='Rectifier') return 'S-Pro'+(v('input_fase')||'1')+' '+(v('output_voltage')||'')+(v('output_current')?'-'+v('output_current')+'A':'');
  if(cat==='UPS'){ const kva=v('output_kva'); return 'A-Pro'+(v('input_fase')||'3')+'/'+(v('output_fase')||'1')+' '+(kva?kva+'K':''); }
  if(cat==='Inverter'){ const kva=v('output_kva'); return 'INV '+(kva?kva+'K':''); }
  if(cat==='Panel ACDB') return 'ACDB '+(v('input_voltage')||'')+'V-'+(v('output_current')||'')+'A';
  if(cat==='Panel DCDB') return 'DCDB '+(v('input_voltage')||'')+'V-'+(v('output_current')||'')+'A';
  return '';
}

async function saveItemSpec(){
  const {itemId, poId, category} = _specCtx;
  const fields = SPEC_FIELDS[category]||[];
  // Hanya field ini yang benar-benar ada di tabel item_specs.
  // Field lain (input_voltage_tolerance, pulse, notes, dll) disimpan ke kolom extra_specs sebagai JSON.
  const KNOWN_COLS = ['input_fase','input_voltage','output_voltage','output_current','output_kva','output_fase'];
  const data = {item_id: itemId, kategori: category, updated_at: new Date().toISOString()};
  const extras = {};
  fields.forEach(f => {
    const el = document.getElementById('spec_'+f.id);
    if (!el) return;
    const val = el.value.trim() || null;
    if (KNOWN_COLS.includes(f.id)) {
      data[f.id] = val;
    } else if (val !== null) {
      extras[f.id] = val;
    }
  });
  if (Object.keys(extras).length) data.extra_specs = extras;

  try {
    let existing = null;
    try { const _r = await sb.from('item_specs').select('id').eq('item_id',itemId).single(); existing = _r.data; } catch(e) {}
    if (existing) {
      const { error } = await sb.from('item_specs').update(data).eq('item_id',itemId);
      if (error) throw error;
    } else {
      // id auto-generate by Postgres (gen_random_uuid). Jangan set manual.
      const { error } = await sb.from('item_specs').insert(data);
      if (error) throw error;
    }
    toast('Spec disimpan');
    closeAllModals();
    await loadPOs();
    // Refresh tampilan: kalau sedang di tab ETS, re-render list; kalau dari detail PO, re-open
    if (currentModule === 'ets') {
      await renderETSList();
    } else if (poId) {
      openPODetail(poId);
    }
  } catch (e) {
    toast('Gagal simpan spec: ' + (e.message || e));
    console.error('saveItemSpec error:', e);
  }
}
