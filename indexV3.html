async function backToPKList() {
  pkState.openPkId = null;
  pkState.pkItems  = [];
  await bdRenderPKTab(document.getElementById('bdContent'));
}

// ── Toggle item masuk/keluar PK ───────────────────────────────
async function pkToggleItem(pkId, bomItemId, checked, qty, unitPrice) {
  if (checked) {
    await sb.from('bom_pk_items').upsert({
      pk_id: pkId, bom_item_id: bomItemId,
      qty_pk: qty, unit_price: unitPrice, status: 'BELUM'
    }, { onConflict: 'pk_id,bom_item_id' });
  } else {
    await sb.from('bom_pk_items').delete()
      .eq('pk_id', pkId).eq('bom_item_id', bomItemId);
  }
  // Reload detail
  await openPKDetail(pkId);
  // Refresh pkState.pks
  const { data: pks } = await sb.from('bom_pk_requests')
    .select('*,bom_pk_items(*)').eq('bom_id', bomDetail.data.id)
    .order('created_at', { ascending: true });
  pkState.pks = pks || [];
  toast(checked ? '✓ Item ditambahkan ke PK' : 'Item dihapus dari PK');
}

async function pkUpdateQty(pkId, bomItemId, newQty) {
  if (!newQty||newQty<=0) return;
  await sb.from('bom_pk_items').update({ qty_pk: newQty })
    .eq('pk_id', pkId).eq('bom_item_id', bomItemId);
  await openPKDetail(pkId);
  const { data: pks } = await sb.from('bom_pk_requests')
    .select('*,bom_pk_items(*)').eq('bom_id', bomDetail.data.id)
    .order('created_at', { ascending: true });
  pkState.pks = pks || [];
  toast('Qty diperbarui');
}

async function pkUpdateItemStatus(pkId, bomItemId, status) {
  await sb.from('bom_pk_items').update({ status })
    .eq('pk_id', pkId).eq('bom_item_id', bomItemId);
  await openPKDetail(pkId);
  const { data: pks } = await sb.from('bom_pk_requests')
    .select('*,bom_pk_items(*)').eq('bom_id', bomDetail.data.id)
    .order('created_at', { ascending: true });
  pkState.pks = pks || [];
  toast('Status diperbarui');
}

async function pkSelectAll(pkId) {
  const d = bomDetail.data;
  const items = (d.bom_items||[]);
  for (const it of items) {
    await sb.from('bom_pk_items').upsert({
      pk_id: pkId, bom_item_id: it.id,
      qty_pk: it.qty, unit_price: it.unit_price||0, status: 'BELUM'
    }, { onConflict: 'pk_id,bom_item_id' });
  }
  await openPKDetail(pkId);
  toast('Semua item dipilih');
}

async function pkDeselectAll(pkId) {
  if (!confirm('Hapus semua item dari PK ini?')) return;
  await sb.from('bom_pk_items').delete().eq('pk_id', pkId);
  await openPKDetail(pkId);
  toast('Semua item dihapus dari PK');
}

async function deletePKRequest(pkId) {
  if (!confirm('Hapus PK ini beserta semua item-nya?')) return;
  await sb.from('bom_pk_requests').delete().eq('id', pkId);
  pkState.openPkId = null;
  pkState.pkItems  = [];
  toast('PK dihapus');
  await bdRenderPKTab(document.getElementById('bdContent'));
}

// ── Export Excel PK ──────────────────────────────────────────
async function pkExportExcel(pkId) {
  const pk = pkState.pks.find(p=>p.id===pkId);
  if (!pk) return;
  const d  = bomDetail.data;
  const XLSX = window.XLSX;
  if (!XLSX) { toast('Library Excel belum siap'); return; }

  const { data: pkItems } = await sb
    .from('bom_pk_items')
    .select('*,bom_items(id,name,note,unit,part_number,sort_order)')
    .eq('pk_id', pkId)
    .order('bom_items(sort_order)');

  const items = (pkItems||[]).sort((a,b)=>
    (a.bom_items?.sort_order||0)-(b.bom_items?.sort_order||0));

  // Group
  const grups=[], grupMap={};
  items.forEach(pi=>{
    const g=pkGrup(pi.bom_items?.note);
    if(!grupMap[g]){grupMap[g]=[];grups.push(g);}
    grupMap[g].push(pi);
  });

  const tgl = fmtDate(new Date().toISOString());
  const aoa = [
    ['PENGAJUAN KEUANGAN (PK)'],
    [`No. PK: ${pk.no_pk}  |  ${pk.judul}`],
    [`BOM: ${d.title}  |  ${d.unit_category}  |  Tanggal: ${tgl}`],
    [`Status: ${pk.status}${pk.keterangan?' | Ket: '+pk.keterangan:''}`],
    [],
    ['NO','NAMA KOMPONEN','QTY PK','UNIT','HARGA SATUAN (IDR)','NILAI (IDR)'],
  ];

  let grand=0, seq=1;
  grups.forEach(grup=>{
    aoa.push(['',grup,'','','','']);
    grupMap[grup].forEach(pi=>{
      const nilai=parseFloat(pi.nilai||0);
      grand+=nilai;
      aoa.push([seq++, pi.bom_items?.name||'', parseFloat(pi.qty_pk),
        pi.bom_items?.unit||'', parseFloat(pi.unit_price||0), nilai]);
    });
    const sub=grupMap[grup].reduce((s,pi)=>s+parseFloat(pi.nilai||0),0);
    aoa.push(['','Sub Total '+grup,'','','',sub]);
    aoa.push([]);
  });
  aoa.push([]);
  aoa.push(['','','','','GRAND TOTAL',grand]);
  aoa.push(['','','','','','⚠ Belum termasuk PPN 11% & ongkir']);

  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:5},{wch:42},{wch:8},{wch:8},{wch:18},{wch:18}];
  const wb2=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb2,ws,'PK');
  XLSX.writeFile(wb2,`${pk.no_pk.replace(/[\/\\]/g,'-')}.xlsx`);
  toast('Export berhasil');
}

async function bdPKExportExcel() {
  const d = bomDetail.data;
  if (!d) return;
  const items = (d.bom_items||[])
    .filter(it => it.pk_flag==='Y' && it.pk_status==='BELUM')
    .sort((a,b) => (a.sort_order||0)-(b.sort_order||0));
  if (!items.length) { toast('Tidak ada item PK=Y & BELUM'); return; }

  const XLSX = window.XLSX;
  if (!XLSX) { toast('Library Excel belum siap'); return; }

  const tgl = fmtDate(new Date().toISOString());
  const aoa = [
    ['PENGAJUAN KEUANGAN (PK)'],
    [`BOM: ${d.title}`],
    [`Kategori: ${d.unit_category}  |  ID: ${d.id}  |  Tanggal: ${tgl}`],
    [],
    ['NO','NAMA ITEM / KOMPONEN','QTY','UNIT','HARGA SATUAN (IDR)','JUMLAH (IDR)'],
  ];

  const grups = [], grupMap = {};
  items.forEach(it => {
    const g = pkGrup(it.note);
    if (!grupMap[g]) { grupMap[g] = []; grups.push(g); }
    grupMap[g].push(it);
  });

  let grand = 0, seq = 1;
  grups.forEach(grup => {
    aoa.push(['', grup, '', '', '', '']); // group header
    grupMap[grup].forEach(it => {
      const jml = it.qty*(it.unit_price||0);
      grand += jml;
      aoa.push([seq++, it.name, it.qty, it.unit, it.unit_price||0, jml]);
    });
    const subT = grupMap[grup].reduce((s,it)=>s+(it.qty*(it.unit_price||0)),0);
    aoa.push(['','Sub Total '+grup,'','','',subT]);
    aoa.push([]); // spacer
  });

  aoa.push([]);
  aoa.push(['','','','','GRAND TOTAL', grand]);
  aoa.push(['','','','','','⚠ Belum termasuk PPN 11% & ongkir']);
  aoa.push(['','','','','Battery Yuasa & Modul PESS','→ Konfirmasi Finance']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:5},{wch:42},{wch:7},{wch:8},{wch:18},{wch:18}];
  const wb2 = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb2, ws, 'PK');
  XLSX.writeFile(wb2, `PK_${d.id}.xlsx`);
  toast('Export PK berhasil');
}

// ─── EXPORT ─────────────────────────────────────────────────
// Extract section name from note. Handles multiple formats:
//   Canonical:  "Section 1 Mechanical - subnote"  → "Section 1 Mechanical"
//   Legacy:     "Section 1: Mechanical\nGenerated: foo\n[OVERRIDDEN]" → "Section 1 Mechanical"
//   Dirty:      "FOR 110VDC WITH RS485..." or "CUSTOM ITEM CBL-005" → "(Custom Items)"
function extractSection(note) {
  if (!note) return '(Tanpa Section)';
  let s = String(note).trim();
  
  // Take only the first line (legacy dirty format had \n)
  const firstNewline = s.indexOf('\n');
  if (firstNewline > 0) s = s.substring(0, firstNewline).trim();
  
  // Strip dash separator if present (canonical format)
  for (const sep of [' — ', ' – ', ' - ']) {
    const idx = s.indexOf(sep);
    if (idx > 0) { s = s.substring(0, idx).trim(); break; }
  }
  
  // Normalize "Section X:" → "Section X" (remove colon after section number)
  s = s.replace(/^(Section\s+\d+)\s*:\s*/i, '$1 ');
  
  // If still doesn't look like a section header (e.g. "FOR 110VDC..." or "CUSTOM ITEM..."), bucket to (Custom Items)
  if (!/^Section\s+\d+/i.test(s)) {
    return '(Custom Items)';
  }
  
  return s;
}

// Extract sub-note (after the section/dash). Strips legacy noise (Generated:, [OVERRIDDEN], etc).
function extractSubNote(note) {
  if (!note) return '';
  const s = String(note).trim();
  // Format baru: "A. Grup | keterangan" — ambil bagian setelah pipe
  if (s.includes('|')) {
    return s.split('|').slice(1).join('|').trim();
  }
  // Format lama (dash separator)
  for (const sep of [' — ', ' – ', ' - ']) {
    const idx = s.indexOf(sep);
    if (idx > 0) return cleanSubNote(s.substring(idx + sep.length).trim());
  }
  // Format lama (newline)
  const nl = s.indexOf('\n');
  if (nl > 0) return cleanSubNote(s.substring(nl + 1));
  return '';
}


// Strip "Generated:" prefix, "[OVERRIDDEN]" markers, attribution lines from sub-note
function cleanSubNote(s) {
  if (!s) return '';
  let out = String(s)
    .replace(/\[BOM_EXTRA_JSON\][\s\S]*?\[\/BOM_EXTRA_JSON\]/gi, '')
    .replace(/^\s*Generated:\s*/i, '')
    .replace(/\[OVERRIDDEN\]\s*/gi, '')
    .replace(/^\s*Inline edit by [^\n]*$/gim, '')
    .replace(/^\s*Custom item ditambahkan manual oleh [^\n]*$/gim, '')
    .replace(/\s*\n\s*/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (out.length > 150) out = out.substring(0, 147) + '...';
  return out;
}

// Group items by section, preserving order
function groupItemsBySection(items) {
  const groups = [], map = {};
  for (const it of items) {
    // Gunakan pkGrup (pipe split) — konsisten dengan tab PK dan BOM view
    const sec = pkGrup(it.note);
    if (!map[sec]) { map[sec] = { name: sec, items: [] }; groups.push(map[sec]); }
    map[sec].items.push(it);
  }
  return groups;
}

async function exportBOMExcel(bomId, withPrice) {
  if (typeof XLSX === 'undefined') { toast('SheetJS belum dimuat'); return; }
  const { data: bom } = await sb.from('bom_lists').select('*,bom_items(*),app_users:created_by(full_name)').eq('id', bomId).single();
  if (!bom) return;
  const items = (bom.bom_items || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const groups = groupItemsBySection(items);

  // Build sheet using AOA + cell-level formatting
  const aoa = [];
  const merges = [];
  const styles = {}; // map "A1" -> style obj
  const colCount = withPrice ? 6 : 4; // No, Nama, Qty, Unit, [Harga, Subtotal,] Note

  // ── Title ──
  aoa.push(['BILL OF MATERIALS']);
  merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: colCount - 1 } });

  aoa.push([bom.title]);
  merges.push({ s: { r: 1, c: 0 }, e: { r: 1, c: colCount - 1 } });

  aoa.push([]);

  // ── Meta info ──
  const metaStart = aoa.length;
  aoa.push(['BOM ID', bom.id]);
  aoa.push(['Kategori Unit', bom.unit_category || '']);
  aoa.push(['Status', bom.status]);
  aoa.push(['Tanggal', fmtDate(bom.created_at)]);
  aoa.push(['Dibuat oleh', bom.app_users?.full_name || '—']);
  if (bom.pp_request_id) aoa.push(['PP Request', bom.pp_request_id]);
  if (bom.po_id) aoa.push(['PO', bom.po_id]);
  if (bom.description) aoa.push(['Deskripsi', bom.description]);
  aoa.push([]);

  // ── Header row ──
  const headerRowIdx = aoa.length;
  if (withPrice) {
    aoa.push(['No', 'Nama Komponen', 'Qty', 'Unit', 'Harga Satuan', 'Subtotal', 'Note']);
  } else {
    aoa.push(['No', 'Nama Komponen', 'Qty', 'Unit', 'Note']);
  }
  const numCols = withPrice ? 7 : 5;

  // ── Sections + Items ──
  let runningNo = 0;
  let grandTotal = 0;
  const sectionRows = []; // track section header row indices for styling
  const subtotalRows = []; // track subtotal row indices
  const dataRowStart = aoa.length;

  for (const g of groups) {
    // Section header row
    aoa.push([g.name.toUpperCase()]);
    sectionRows.push(aoa.length - 1);
    merges.push({ s: { r: aoa.length - 1, c: 0 }, e: { r: aoa.length - 1, c: numCols - 1 } });

    let sectionTotal = 0;
    for (const it of g.items) {
      runningNo++;
      const sub = (it.qty || 0) * (it.unit_price || 0);
      sectionTotal += sub;
      grandTotal += sub;
      const subNote = extractSubNote(it.note);
      if (withPrice) {
        aoa.push([runningNo, it.name, it.qty, it.unit || 'pcs', it.unit_price || 0, sub, subNote]);
      } else {
        aoa.push([runningNo, it.name, it.qty, it.unit || 'pcs', subNote]);
      }
    }

    // Subtotal per section (only if withPrice)
    if (withPrice) {
      aoa.push(['', '', '', '', `Subtotal ${g.name}`, sectionTotal, '']);
      subtotalRows.push(aoa.length - 1);
    }
  }

  // ── Grand Total ──
  let grandTotalRowIdx = -1;
  if (withPrice) {
    aoa.push([]);
    aoa.push(['', '', '', '', 'GRAND TOTAL', grandTotal, '']);
    grandTotalRowIdx = aoa.length - 1;
  }

  // ── Footer ──
  aoa.push([]);
  aoa.push([`Dicetak: ${new Date().toLocaleString('id-ID')}`]);

  // Build sheet
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = withPrice
    ? [{ wch: 5 }, { wch: 50 }, { wch: 8 }, { wch: 8 }, { wch: 16 }, { wch: 18 }, { wch: 40 }]
    : [{ wch: 5 }, { wch: 50 }, { wch: 8 }, { wch: 8 }, { wch: 40 }];

  // ── Apply cell styles ──
  // Helper to set style on cell
  const setStyle = (r, c, style) => {
    const ref = XLSX.utils.encode_cell({ r, c });
    if (!ws[ref]) ws[ref] = { t: 's', v: '' };
    ws[ref].s = Object.assign({}, ws[ref].s || {}, style);
  };

  const borderThin = { style: 'thin', color: { rgb: '999999' } };
  const fullBorder = { top: borderThin, bottom: borderThin, left: borderThin, right: borderThin };

  // Title
  setStyle(0, 0, { font: { bold: true, sz: 16, name: 'Arial' }, alignment: { horizontal: 'left' } });
  // Subtitle
  setStyle(1, 0, { font: { italic: true, sz: 11, color: { rgb: '666666' } } });

  // Meta labels
  for (let r = metaStart; r < headerRowIdx - 1; r++) {
    setStyle(r, 0, { font: { bold: true, sz: 10, color: { rgb: '666666' } } });
    setStyle(r, 1, { font: { sz: 10 }, alignment: { wrapText: true, vertical: 'top' } });
  }

  // Header row
  for (let c = 0; c < numCols; c++) {
    setStyle(headerRowIdx, c, {
      font: { bold: true, sz: 10, color: { rgb: 'FFFFFF' } },
      fill: { fgColor: { rgb: '2C3E50' } },
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      border: fullBorder
    });
  }

  // Section header rows
  for (const sr of sectionRows) {
    for (let c = 0; c < numCols; c++) {
      setStyle(sr, c, {
        font: { bold: true, sz: 11, color: { rgb: '1A4F8B' } },
        fill: { fgColor: { rgb: 'D6E5F5' } },
        alignment: { horizontal: 'left', vertical: 'center' },
        border: fullBorder
      });
    }
  }

  // Data rows (everything between header and grand total that's NOT section/subtotal)
  const dataEnd = grandTotalRowIdx > 0 ? grandTotalRowIdx - 1 : aoa.length - 2;
  const sectionSet = new Set(sectionRows);
  const subtotalSet = new Set(subtotalRows);
  for (let r = dataRowStart; r < dataEnd; r++) {
    if (sectionSet.has(r) || subtotalSet.has(r)) continue;
    for (let c = 0; c < numCols; c++) {
      const isQty = c === 2;
      const isUnit = c === 3;
      const isPrice = withPrice && (c === 4 || c === 5);
      const isNo = c === 0;
      setStyle(r, c, {
        font: { sz: 10 },
        alignment: {
          horizontal: isNo ? 'center' : (isQty ? 'right' : (isUnit ? 'center' : (isPrice ? 'right' : 'left'))),
          vertical: 'top',
          wrapText: c === 1 || (withPrice ? c === 6 : c === 4)
        },
        border: fullBorder
      });
      // Number format for price/subtotal columns
      if (isPrice) {
        const ref = XLSX.utils.encode_cell({ r, c });
        if (ws[ref]) ws[ref].z = '#,##0';
      }
    }
  }

  // Subtotal rows (per section)
  for (const sr of subtotalRows) {
    for (let c = 0; c < numCols; c++) {
      setStyle(sr, c, {
        font: { bold: true, sz: 10, italic: true, color: { rgb: '333333' } },
        fill: { fgColor: { rgb: 'F0F0F0' } },
        alignment: { horizontal: c === 4 ? 'right' : (c === 5 ? 'right' : 'left') },
        border: fullBorder
      });
      if (c === 5) {
        const ref = XLSX.utils.encode_cell({ r: sr, c });
        if (ws[ref]) ws[ref].z = '#,##0';
      }
    }
  }

  // Grand total row
  if (grandTotalRowIdx > 0) {
    for (let c = 0; c < numCols; c++) {
      setStyle(grandTotalRowIdx, c, {
        font: { bold: true, sz: 12, color: { rgb: 'FFFFFF' } },
        fill: { fgColor: { rgb: '2C3E50' } },
        alignment: { horizontal: c === 4 ? 'right' : (c === 5 ? 'right' : 'left') },
        border: fullBorder
      });
      if (c === 5) {
        const ref = XLSX.utils.encode_cell({ r: grandTotalRowIdx, c });
        if (ws[ref]) ws[ref].z = '#,##0';
      }
    }
  }

  // Row heights (auto-fit ratio)
  ws['!rows'] = [];
  ws['!rows'][0] = { hpt: 22 };  // Title
  ws['!rows'][headerRowIdx] = { hpt: 22 };  // Header

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'BOM');
  XLSX.writeFile(wb, `${bom.id}_${(bom.title || 'BOM').replace(/[^a-zA-Z0-9]/g, '_')}.xlsx`, { cellStyles: true });
  toast('Excel diunduh');
}

async function exportBOMPrint(bomId, withPrice) {
  const { data: bom } = await sb.from('bom_lists').select('*,bom_items(*),app_users:created_by(full_name)').eq('id', bomId).single();
  if (!bom) return;
  const items = (bom.bom_items || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const groups = groupItemsBySection(items);
  const grandTotal = items.reduce((s, it) => s + ((it.qty || 0) * (it.unit_price || 0)), 0);
  const numCols = withPrice ? 6 : 4;

  // Build tbody with section grouping
  let runningNo = 0;
  const tbodyHtml = groups.map(g => {
    let secTotal = 0;
    const rows = g.items.map(it => {
      runningNo++;
      const sub = (it.qty || 0) * (it.unit_price || 0);
      secTotal += sub;
      const subNote = extractSubNote(it.note);
      return `<tr>
        <td class="c">${runningNo}</td>
        <td>${(it.name || '').replace(/</g, '&lt;')}</td>
        <td class="num">${it.qty}</td>
        <td class="c">${it.unit || 'pcs'}</td>
        ${withPrice ? `<td class="num">${fmtRp(it.unit_price)}</td><td class="num">${fmtRp(sub)}</td>` : ''}
        <td>${(subNote || '').replace(/</g, '&lt;')}</td>
      </tr>`;
    }).join('');
    const sectionRow = `<tr class="section"><td colspan="${numCols + 1}">${g.name.toUpperCase()}</td></tr>`;
    const subtotalRow = withPrice
      ? `<tr class="subtotal"><td colspan="4" class="num"><em>Subtotal ${g.name}</em></td><td></td><td class="num"><strong>${fmtRp(secTotal)}</strong></td><td></td></tr>`
      : '';
    return sectionRow + rows + subtotalRow;
  }).join('');

  const headerCols = withPrice
    ? `<th class="col-no">#</th><th class="col-name">Nama Komponen</th><th class="col-qty">Qty</th><th class="col-unit">Unit</th><th class="col-price">Harga Satuan</th><th class="col-sub">Subtotal</th><th class="col-note">Note</th>`
    : `<th class="col-no">#</th><th class="col-name">Nama Komponen</th><th class="col-qty">Qty</th><th class="col-unit">Unit</th><th class="col-note">Note</th>`;

  // GRAND TOTAL as a standalone block AFTER the table — NOT inside <tfoot>
  // because <tfoot> default behavior is to repeat on every page when printing.
  const grandTotalBlock = withPrice
    ? `<div class="grand-total"><span>GRAND TOTAL</span><span>${fmtRp(grandTotal)}</span></div>`
    : '';

  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>BOM ${bom.id}</title>
    <style>
      @page { size: A4 landscape; margin: 12mm 10mm; }
      *{box-sizing:border-box}
      body{font-family:Arial,sans-serif;padding:0;color:#000;font-size:10px;margin:0}
      h1{font-size:16px;margin:0 0 3px}
      .header{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
      .meta{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:3px 10px;font-size:10px;margin-bottom:10px}
      .meta .k{color:#666}
      table{border-collapse:collapse;margin-top:6px;table-layout:fixed}
      th,td{border:1px solid #999;padding:4px 5px;text-align:left;vertical-align:top;word-wrap:break-word;overflow-wrap:break-word}
      th{background:#2C3E50;color:#fff;font-size:9px;text-transform:uppercase;text-align:center}
      td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
      td.c{text-align:center}
      /* Fixed widths so columns never get squeezed */
      .col-no{width:28px}
      .col-name{width:auto}
      .col-qty{width:38px}
      .col-unit{width:38px}
      .col-price{width:80px}
      .col-sub{width:90px}
      .col-note{width:180px;font-size:9px;color:#555}
      tr.section td{background:#D6E5F5;color:#1A4F8B;font-weight:bold;font-size:10px;padding:5px 7px;border-color:#1A4F8B}
      tr.subtotal td{background:#F0F0F0;font-style:italic;font-size:9px}
      .grand-total{
        display:flex;justify-content:space-between;align-items:center;
        background:#2C3E50;color:#fff;font-weight:bold;font-size:13px;
        padding:10px 14px;margin-top:0;border:1px solid #2C3E50;
        page-break-inside:avoid;break-inside:avoid;
      }
      .grand-total span:last-child{font-size:14px}
      .footer{margin-top:20px;font-size:9px;color:#666;border-top:1px solid #ccc;padding-top:6px}
      @media print{
        body{padding:0}
        thead{display:table-header-group}
        tr.section{page-break-inside:avoid}
        tr{page-break-inside:avoid}
        .grand-total{page-break-before:avoid}
      }
    </style></head><body>
    <div class="header">
      <h1>BILL OF MATERIALS</h1>
      <div style="font-size:12px;color:#666">${bom.title}</div>
    </div>
    <div class="meta">
      <span class="k">BOM ID</span><span><strong>${bom.id}</strong></span>
      <span class="k">Kategori Unit</span><span>${bom.unit_category || '—'}</span>
      <span class="k">Status</span><span>${bom.status}</span>
      <span class="k">Tanggal</span><span>${fmtDate(bom.created_at)}</span>
      <span class="k">Dibuat oleh</span><span>${bom.app_users?.full_name || '—'}</span>
      ${bom.pp_request_id ? `<span class="k">PP Request</span><span>${bom.pp_request_id}</span>` : ''}
      ${bom.po_id ? `<span class="k">PO</span><span>${bom.po_id}</span>` : ''}
      ${bom.description ? `<span class="k">Deskripsi</span><span>${bom.description}</span>` : ''}
    </div>
    <table>
      <thead><tr>${headerCols}</tr></thead>
      <tbody>${tbodyHtml}</tbody>
    </table>
    ${grandTotalBlock}
    <div class="footer">Dicetak pada ${new Date().toLocaleString('id-ID')} — Panel System</div>
    <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script>
  </body></html>`);
  w.document.close();
}
