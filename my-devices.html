<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAE Energy — Unit Saya</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('panelvision-theme')==='light'?'light':'dark'}catch(_){document.documentElement.dataset.theme='dark'}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#071019;--panel:#0d1823;--panel2:#111f2d;--line:#294155;--text:#eaf2f8;--muted:#94aabd;--green:#23c483;--red:#ef5d6c;--blue:#3ba7ff;--amber:#f59e0b}
html[data-theme=light]{--bg:#eef3f7;--panel:#fff;--panel2:#f5f8fa;--line:#b8cad7;--text:#142733;--muted:#506879;--green:#087451;--red:#a52e40;--blue:#146b9e;--amber:#805400;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.top{min-height:62px;display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{font-weight:850;letter-spacing:.06em}.brand b{color:#ef3434}.spacer{flex:1}.main{width:min(1160px,100%);margin:auto;padding:18px}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px}.hero{padding:18px;margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:9px 13px;min-height:42px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:#145b8f;border-color:#287fb2;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.card{padding:15px}.unit-head{display:flex;align-items:flex-start;gap:10px}.unit-title{font-size:18px;font-weight:850}.serial{font:700 13px ui-monospace,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #23c48377}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:13px 0}.detail{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px}.detail span{display:block;color:var(--muted);font-size:11px}.detail b{display:block;margin-top:2px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 13px}.badge{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;color:var(--text)}.badge.read{color:#7ee9c0;border-color:#29785e}.badge.write{color:#ffd28a;border-color:#8a6420}.empty,.notice,.error{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel);text-align:center}.error{color:#ffd0d6;border-color:#74303b;background:#35151b}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}.dialog{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.dialog h2{margin:0 0 5px}.field{margin-top:11px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:10px;min-height:44px;font:inherit}.show-password{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:13px;cursor:pointer}.show-password input{width:18px;height:18px;accent-color:var(--blue)}
html[data-theme=light] .btn.primary{background:#dceef8;color:#123f58}html[data-theme=light] .badge{color:#233b4a;background:#fff}html[data-theme=light] .badge.read{color:#086044;border-color:#2d8a68;background:#eaf8f2}html[data-theme=light] .badge.write{color:#6d4900;border-color:#b27a15;background:#fff6df}html[data-theme=light] .input{color:#142733;-webkit-text-fill-color:currentColor}html[data-theme=light] .error{color:#8a2634;background:#fff0f2;border-color:#ca8792}
@media(max-width:650px){.top{padding:9px 10px;flex-wrap:wrap}.brand span{display:none}.main{padding:10px}.hero{padding:14px}.hero h1{font-size:22px}.unit-grid{grid-template-columns:1fr}.details{grid-template-columns:1fr}.top .btn{padding:8px 10px}.user-email{width:100%;order:5}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>SAE</b><span> ENERGY · PANEL VISION</span></div><div class="spacer"></div><span class="muted user-email" id="userEmail"></span><button class="btn" id="themeBtn">Tema</button><button class="btn" id="manageBtn" hidden>Kelola User</button><button class="btn" id="authBtn">Login</button></header>
<main class="main"><section class="hero"><div class="toolbar"><div><h1>Unit Saya</h1><div class="muted">Pilih unit untuk membuka Remote HMI sesuai hak akses Anda.</div></div><div class="spacer"></div><button class="btn" id="refreshBtn">Refresh</button></div></section><div id="message"></div><section class="unit-grid" id="unitGrid"></section></main>
<div class="modal" id="loginModal"><div class="dialog"><h2>Login Panel Vision</h2><div class="muted">Masukkan akun yang telah didaftarkan oleh owner.</div><div class="field"><label>Email</label><input class="input" id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input class="input" id="loginPassword" type="password" autocomplete="current-password"></div><label class="show-password"><input id="showPassword" type="checkbox">Tampilkan password</label><div id="loginMsg"></div><div class="toolbar" style="margin-top:13px"><button class="btn primary" id="loginSubmit">Login</button><button class="btn" id="loginCancel">Batal</button></div></div></div>
<script>
const SB_URL='https://sswslwddemackxrrbpre.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzd3Nsd2RkZW1hY2t4cnJicHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTE2MjcsImV4cCI6MjA5MTMyNzYyN30.aQivrCTGvzJ6-_OLUOUvFjOcu7qQ53Ajv2urvLZb9xg';
const sb=supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const permissionLabels={can_monitor:'Monitoring',can_events:'Events',can_settings:'Settings',can_relays:'Relay',can_calibration:'Calibration',can_control:'Control'};
let currentUser=null,memberships=[],panelAccess=[];
function setTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem('panelvision-theme',theme)}catch(_){}}
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
function showMessage(text,type='notice'){$('message').innerHTML=text?`<div class="${type}">${esc(text)}</div>`:''}
function showLogin(){$('showPassword').checked=false;$('loginPassword').type='password';$('loginModal').classList.add('show');setTimeout(()=>$('loginEmail').focus(),50)}
function hideLogin(){$('loginModal').classList.remove('show');$('loginPassword').value='';$('showPassword').checked=false;$('loginPassword').type='password';$('loginMsg').innerHTML=''}
$('showPassword').onchange=()=>{$('loginPassword').type=$('showPassword').checked?'text':'password'};$('loginCancel').onclick=hideLogin;
function effectivePermissions(panel){const membership=memberships.find(item=>item.organization_id===panel.organization_id);if(!membership)return {};if(membership.role==='owner'||membership.access_scope==='all')return membership;return panelAccess.find(item=>item.panel_id===panel.id)||{};}
function renderPanels(panels){
  if(!panels.length){$('unitGrid').innerHTML='<div class="empty"><b>Belum ada unit yang dapat diakses.</b><div class="muted" style="margin-top:5px">Hubungi owner Panel Vision untuk pemetaan unit.</div></div>';return;}
  $('unitGrid').innerHTML=panels.map(panel=>{const membership=memberships.find(item=>item.organization_id===panel.organization_id),owner=membership?.role==='owner',permissions=effectivePermissions(panel);const badges=Object.entries(permissionLabels).filter(([key])=>owner||permissions[key]).map(([key,label])=>`<span class="badge ${key==='can_monitor'||key==='can_events'?'read':'write'}">${label}</span>`).join('');const title=panel.binding_label||panel.name||panel.model||'Panel Vision';return `<article class="card"><div class="unit-head"><div><div class="unit-title">${esc(title)}</div><div class="serial">SN: ${esc(panel.serial_number||'—')}</div></div><div class="spacer"></div><span class="status"><span class="dot"></span>${panel.active===false?'Nonaktif':'Terdaftar'}</span></div><div class="details"><div class="detail"><span>Model</span><b>${esc(panel.model||'—')}</b></div><div class="detail"><span>Lokasi</span><b>${esc(panel.location||'—')}</b></div></div><div class="badges">${owner?'<span class="badge">OWNER</span>':''}${badges}</div><a class="btn primary" href="remote-hmi.html?v=20260821b&sn=${encodeURIComponent(panel.serial_number||'')}">Buka Remote HMI ↗</a></article>`}).join('');
}
async function load(){
  const {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;$('userEmail').textContent=currentUser?.email||'';$('authBtn').textContent=currentUser?'Logout':'Login';$('manageBtn').hidden=true;
  if(!currentUser){memberships=[];panelAccess=[];$('unitGrid').innerHTML='';showMessage('Silakan login untuk melihat unit yang diberikan kepada Anda.');showLogin();return;}
  showMessage('Memuat unit Anda…');
  const [membershipResult,accessResult,panelResult]=await Promise.all([
    sb.from('pv_memberships').select('organization_id,role,access_scope,can_monitor,can_events,can_settings,can_relays,can_calibration,can_control').eq('user_id',currentUser.id),
    sb.from('pv_panel_access').select('panel_id,access_role,can_monitor,can_events,can_settings,can_relays,can_calibration,can_control').eq('user_id',currentUser.id),
    sb.from('pv_panels').select('id,organization_id,name,location,model,serial_number,binding_type,binding_label,active').order('serial_number')
  ]);
  const error=membershipResult.error||accessResult.error||panelResult.error;if(error){showMessage(error.message,'error');return;}
  memberships=membershipResult.data||[];panelAccess=accessResult.data||[];$('manageBtn').hidden=!memberships.some(item=>item.role==='owner');showMessage('');renderPanels(panelResult.data||[]);
}
$('loginSubmit').onclick=async()=>{const email=$('loginEmail').value.trim(),password=$('loginPassword').value;$('loginSubmit').disabled=true;$('loginMsg').innerHTML='<div class="muted" style="margin-top:10px">Login…</div>';const {error}=await sb.auth.signInWithPassword({email,password});$('loginSubmit').disabled=false;if(error){$('loginMsg').innerHTML=`<div class="error" style="margin-top:10px">${esc(error.message)}</div>`;return;}hideLogin();await load()};
$('authBtn').onclick=async()=>{if(currentUser){await sb.auth.signOut();currentUser=null;await load()}else showLogin()};$('refreshBtn').onclick=load;$('manageBtn').onclick=()=>location.href='user-access.html?v=20260821b';sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script>
</body>
</html>
