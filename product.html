
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAE Energy — Product Information</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#CC0000;--green:#1a7a3c;--border:#e0e0e0;--text:#1a1a1a;--muted:#666;--offwhite:#f7f7f7}
body{font-family:'DM Sans',sans-serif;background:var(--offwhite);color:var(--text);min-height:100vh}

/* SCAN SCREEN */
.scan-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;background:#f0f7f2}
.scan-card{background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:420px;text-align:center;border:1px solid var(--border);box-shadow:0 8px 40px rgba(0,0,0,.08)}
.scan-logo{width:150px;margin:0 auto 1.5rem;display:block}
.scan-card h2{font-size:18px;font-weight:700;margin-bottom:6px}
.scan-card p{font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.6}
.scan-input-wrap{position:relative;margin-bottom:12px}
.scan-input{width:100%;padding:14px 48px 14px 16px;border:2px solid var(--border);border-radius:12px;font-size:16px;font-family:'DM Mono',monospace;letter-spacing:1px;outline:none;transition:border-color .2s;text-transform:uppercase}
.scan-input:focus{border-color:var(--green)}
.scan-input::placeholder{font-family:'DM Sans',sans-serif;letter-spacing:0;font-size:14px;text-transform:none}
.scan-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:12px;font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;transition:background .2s}
.scan-btn:hover{background:#15632f}
.scan-error{color:var(--red);font-size:13px;margin-top:10px;display:none;background:#fff0f0;padding:10px;border-radius:8px}
.scan-hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}

/* APP */
.app{display:none;min-height:100vh;flex-direction:column}
.header{background:#fff;border-bottom:3px solid var(--red)}
.header-inner{max-width:1180px;margin:0 auto;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.header-logo{height:36px;object-fit:contain}
.badge-green{background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}

/* HERO */
.hero{background:#fff;border-bottom:1px solid var(--border)}
.hero-inner{max-width:1180px;margin:0 auto;padding:1.35rem 1.5rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:1.5rem;align-items:stretch}
.hero-main{display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero-cat{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--red);letter-spacing:.05em;margin-bottom:4px}
.hero-model{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
.sn-block{background:var(--offwhite);border-radius:10px;padding:10px 14px;border-left:4px solid var(--red);display:inline-block;max-width:100%}
.sn-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sn-value{font-family:'DM Mono',monospace;font-size:15px;font-weight:700;letter-spacing:1.5px;overflow-wrap:anywhere}
.hero-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero-fact{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:11px;color:var(--muted)}
.hero-fact strong{color:var(--text);font-weight:700}
.hero-customer{background:#eef8f1;color:var(--green);border:1px solid #cfe8d6;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;text-align:left;min-width:0}
.hero-customer-label{font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:5px}
.hero-customer-name{font-size:15px;font-weight:700;line-height:1.35;color:#125f31;overflow-wrap:anywhere}

/* TABS */
.tabs-wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}
.tab-bar{display:flex;border-bottom:2px solid var(--border);margin-top:1.25rem;gap:2px;overflow-x:auto}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;border-radius:6px 6px 0 0;transition:all .15s}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}

/* CONTENT */
.content{width:100%;max-width:1180px;margin:0 auto;padding:1.25rem 1.5rem;flex:1}
.section{background:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1rem;border:1px solid var(--border)}
.sect-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:1rem;padding-bottom:8px;border-bottom:2px solid var(--green);display:inline-block}
.spec-table{width:100%;border-collapse:collapse}
.spec-table tr:not(:last-child) td{border-bottom:1px solid #f0f0f0}
.spec-key{font-size:13px;color:var(--muted);padding:9px 0;width:50%}
.spec-val{font-size:13px;font-weight:600;padding:9px 0;text-align:right}
.dl-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.dl-item:last-child{border-bottom:none}
.dl-btn{padding:7px 18px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.contact-card{background:var(--offwhite);border-radius:10px;padding:1.25rem;border-left:4px solid var(--red)}
.contact-card h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin-bottom:8px}
.contact-card p{font-size:13px;color:var(--muted);line-height:1.8}
.footer{background:var(--text);color:#888;text-align:center;padding:1.5rem;font-size:12px;margin-top:auto}
.footer span{color:var(--red)}
.loading{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
.scan-again-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;background:#fff;color:var(--muted);margin-top:8px}
.hmi-section{padding:18px}
.hmi-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hmi-toolbar-copy{min-width:0}
.hmi-toolbar-title{font-size:14px;font-weight:700;color:var(--text)}
.hmi-toolbar-sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.hmi-toolbar-sn{font-family:'DM Mono',monospace;color:var(--text);font-weight:600;overflow-wrap:anywhere}
.hmi-fullscreen{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 14px;background:var(--green);color:#fff;border-radius:9px;text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap}
.hmi-fullscreen:hover{background:#15632f}
.hmi-frame-shell{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0a0e1a}
.hmi-frame{display:block;width:100%;height:720px;min-height:520px;border:0;background:#0a0e1a;transition:height .18s ease}
@media(max-width:760px){
  .header-inner{padding:.65rem 1rem}.header-logo{height:32px}.badge-green{display:none}.scan-again-btn{min-height:40px;margin-top:0;padding:7px 11px}
  .hero-inner{padding:1.05rem 1rem;grid-template-columns:minmax(0,1fr) minmax(190px,250px);gap:1rem}
  .hero-model{font-size:25px}.hero-customer{padding:12px}
  .tabs-wrap{padding:0;position:sticky;top:0;z-index:20;background:rgba(247,247,247,.96);backdrop-filter:blur(8px)}
  .tab-bar{margin-top:0;padding:0 10px;scrollbar-width:none}
  .tab-btn{min-height:46px;padding:10px 15px}
  .content{padding:12px 10px}.section{padding:1.15rem}
  .hmi-section{padding:12px}.hmi-frame{min-height:480px}
}
@media(max-width:600px){
  .hero-inner{grid-template-columns:1fr;gap:10px}
  .hero-customer{display:block;text-align:left}
  .hero-facts{display:grid;grid-template-columns:1fr 1fr}
  .hero-fact{border-radius:9px;display:block;padding:8px 10px}.hero-fact span{display:block;margin-bottom:2px}.hero-fact strong{display:block;overflow-wrap:anywhere}
  .contact-grid{grid-template-columns:1fr}
  .hero-model{font-size:23px}.sn-block{display:block;width:100%}
  .hmi-toolbar{align-items:stretch}.hmi-toolbar-copy{width:100%}.hmi-fullscreen{width:100%}
  .hmi-frame-shell{border-radius:10px}.hmi-frame{min-height:440px}
}


/* PANEL VISION MONITORING */
.monitor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:1rem}
.monitor-toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monitor-select,.monitor-btn{font-family:inherit;font-size:12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);padding:8px 11px}
.monitor-btn{cursor:pointer;font-weight:600}.monitor-btn:hover{border-color:var(--green);color:var(--green)}.monitor-btn:disabled{opacity:.45;cursor:not-allowed}
.monitor-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.monitor-status-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.monitor-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#f3f4f6;border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted)}
.monitor-dot{width:8px;height:8px;border-radius:50%;background:#999}.monitor-dot.ok{background:#1a7a3c;box-shadow:0 0 0 3px rgba(26,122,60,.12)}.monitor-dot.bad{background:#cc0000}.monitor-dot.warn{background:#d97706}
.monitor-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:1rem}
.monitor-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px;min-width:0}
.monitor-card-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.monitor-card-value{font-size:23px;font-weight:700;line-height:1.15;word-break:break-word}.monitor-card-unit{font-size:11px;color:var(--muted);margin-left:4px}
.monitor-chart-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1rem}
.monitor-chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.monitor-chart-title{font-size:14px;font-weight:700}.monitor-window{font-size:11px;color:var(--muted);margin-top:3px}
.monitor-canvas-wrap{height:330px;border:1px solid var(--border);border-radius:9px;background:#fbfbfb;overflow:hidden;position:relative}
#monitorCanvas{display:block;width:100%;height:100%}
.monitor-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.monitor-error{background:#fff0f0;border:1px solid #f2b8b8;color:#9f1111;padding:12px;border-radius:9px;font-size:12px;line-height:1.6}
.monitor-empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:13px}
@media(max-width:600px){.monitor-canvas-wrap{height:270px}.monitor-toolbar{align-items:flex-start}.monitor-toolbar-group{width:100%}.monitor-select{flex:1;min-width:110px}}

</style>
</head>

const sb=supabase.createClient(SB_URL,SB_KEY);

let codeReader = null;

async function startCamera(){
  document.getElementById('cameraContainer').style.display='block';
  document.getElementById('btnCamera').style.display='none';
  try {
    codeReader = new ZXing.BrowserMultiFormatReader();
    const videoEl = document.getElementById('cameraVideo');
    await codeReader.decodeFromVideoDevice(null, videoEl, (result, err) => {
      if(result) {
        const text = result.getText();
        document.getElementById('snInput').value = text.toUpperCase();
        stopCamera();
        findBySN();
      }
    });
  } catch(e) {
    stopCamera();
    showError('Kamera tidak dapat diakses. Pastikan izin kamera sudah diberikan.');
  }
}

function stopCamera(){
  if(codeReader) { codeReader.reset(); codeReader = null; }
  document.getElementById('cameraContainer').style.display='none';
  document.getElementById('btnCamera').style.display='flex';
}

// Auto-focus input on load
window.onload = () => {
  document.getElementById('snInput').focus();
  // Check URL param for direct SN access
  const sn = new URLSearchParams(location.search).get('sn');
  if(sn){ document.getElementById('snInput').value=sn; findBySN(); }
};

async function findBySN(){
  const sn = document.getElementById('snInput').value.trim().toUpperCase();
  if(!sn){ showError('Masukkan serial number terlebih dahulu'); return; }

  const errEl = document.getElementById('scanError');
  errEl.style.display='none';
  document.querySelector('.scan-btn').textContent='Mencari...';
  document.querySelector('.scan-btn').disabled=true;

  let item = null, unit = null;

  // 1) Cari exact match di product_units dulu (sumber baru, per-unit, tidak rapuh)
  const { data: units } = await sb.from('product_units')
    .select('*,po_items(*,item_specs(*),item_detail_specs(*),purchase_orders(id,no_po,no_project,customer_name,project_name,download_files))')
    .eq('serial_number', sn)
    .limit(1);

  if (units && units.length) {
    unit = units[0];
    item = unit.po_items;
  } else {
    // 2) Fallback: SN lama (sebelum migrasi per-unit), masih tersimpan sbg string gabungan di po_items
    const { data: items, error } = await sb.from('po_items')
      .select('*,item_specs(*),item_detail_specs(*),purchase_orders(id,no_po,no_project,customer_name,project_name,download_files)')
      .ilike('serial_number', '%'+sn+'%');

    if (!error && items && items.length) {
      item = items.find(it =>
        (it.serial_number||'').split(',').map(s=>s.trim().toUpperCase()).includes(sn)
      ) || items[0];
    }
  }

  document.querySelector('.scan-btn').textContent='Cari Unit';
  document.querySelector('.scan-btn').disabled=false;

  if (!item) {
    showError('Serial number <strong>'+sn+'</strong> tidak ditemukan.<br><br>Silakan cek kembali serial number pada nameplate unit Anda dan pastikan penulisan sama persis. Serial number bersifat <strong>tidak case sensitive</strong> (huruf besar/kecil tidak berpengaruh).');
    return;
  }

  currentItem = item;
  currentUnit = unit; // null kalau fallback lama
  currentPO = item.purchase_orders;
  showApp();
}

function showError(msg){
  const el=document.getElementById('scanError');
  el.innerHTML=msg;
  el.style.display='block';
}

function resetToScan(){
  document.getElementById('scanScreen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('snInput').value='';
  document.getElementById('scanError').style.display='none';
  document.getElementById('snInput').focus();
  currentItem=null; currentPO=null; currentUnit=null;
}

function showApp(){
  document.getElementById('scanScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  renderHero();
  buildTabs();
}

function renderHero(){
  const it=currentItem, po=currentPO;
  // item_specs adalah array (relasi 1-to-many di Supabase karena tidak ada UNIQUE constraint).
  // Ambil row pertama. Untuk safety, handle juga kalau Supabase return object.
  const spec = Array.isArray(it.item_specs) ? (it.item_specs[0]||{}) : (it.item_specs||{});
  const sn = currentUnit ? currentUnit.serial_number : (it.serial_number||'—');
  const prodDate=it.serial_generated_at?new Date(it.serial_generated_at):null;
  const prodDateStr=prodDate?MONTH_ID[prodDate.getMonth()]+' '+prodDate.getFullYear():'—';

  document.getElementById('heroSection').innerHTML=`
    <div class="hero-inner">
      <div class="hero-main">
        <div class="hero-cat">${it.category}</div>
        <div class="hero-model">${it.model_name||'—'}</div>
        <div class="sn-block">
          <div class="sn-label">Serial Number</div>
          <div class="sn-value">${sn}</div>
        </div>
        <div class="hero-facts">
          <div class="hero-fact"><span>Tanggal Produksi</span><strong>${prodDateStr}</strong></div>
          <div class="hero-fact"><span>Project</span><strong>${po.no_project||'—'}</strong></div>
        </div>
      </div>
      <div class="hero-customer">
        <div class="hero-customer-label">CUSTOMER</div>
        <div class="hero-customer-name">${po.customer_name||'—'}</div>
      </div>
    </div>`;
}

function buildTabs(){
  const tabs=[
    {id:'spec',label:'Spesifikasi'},
    {id:'remote',label:'Remote HMI'},
    {id:'download',label:'Dokumen'},
    {id:'contact',label:'Kontak'}
  ];
  document.getElementById('tabBar').innerHTML=tabs.map(t=>
    `<button class="tab-btn${t.id==='spec'?' active':''}" onclick="switchTab('${t.id}',this)">${t.label}</button>`
  ).join('');
  renderSpec();
}

function switchTab(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(tab==='spec') renderSpec();
  else if(tab==='remote') renderRemoteHMI();
  else if(tab==='download') renderDownload();  // async, no await needed (fire-and-forget)
  else if(tab==='contact') renderContact();
}

const row=(k,v)=>`<tr><td class="spec-key">${k}</td><td class="spec-val">${v}</td></tr>`;

      row('Current Adjustable', '0~100% of nominal output current via front panel'),
      ds.r_voltage_adjustable ? row('Voltage Adjustable', `${ds.r_voltage_adjustable} VDC`) : row('Voltage Adjustable', 'via front panel'),
      row('Max Output Current', '100% of nominal output current'),

      row('Output Protection', 'MCB and over voltage protection'),
      row('Charging Principle', 'Constant Current / Constant Voltage'),

  // ─────── PHOTOS (if any) ───────

  document.getElementById('tabContent').innerHTML = html;

async function renderDownload(){
  document.getElementById('tabContent').innerHTML='<div class="loading">Memuat dokumen...</div>';

  const it=currentItem;
  const po=currentPO;
  const ds = Array.isArray(it.item_detail_specs) ? (it.item_detail_specs[0]||{}) : (it.item_detail_specs||{});
  const poFiles=po?.download_files||[];
  const customerName = po?.customer_name || '';

  // Fetch general downloads
  let generalDocs = [];
  try {
    const {data, error} = await sb.from('general_downloads')
      .select('*').eq('is_active', true)
      .order('sort_order',{ascending:true}).order('doc_type',{ascending:true});
    if(!error && data) generalDocs = data;
  } catch(e){}

  // Build flat list of all docs: {category, name, url}
  const allDocs = [];

  // General downloads
  generalDocs.forEach(d => {
    allDocs.push({category: d.doc_type||'Software', name: d.doc_name, url: d.file_url, meta: [d.description, d.version?'v'+d.version:''].filter(Boolean).join(' · ')});
  });

  // Item-specific
  const itemSections = [
    {cat:'Drawing Approval', files: ds.doc_drawing_approval||[]},
    {cat:'As-Built Drawing',  files: ds.doc_asbuilt||[]},
    {cat:'Dokumen FAT',       files: ds.doc_fat||[]},
    {cat:'Dokumen Lainnya',   files: ds.doc_others||[]},
    {cat:'File dari PO',      files: poFiles},
  ];
  itemSections.forEach(s => {
    (s.files||[]).filter(f=>f.visible!==false && (f.name||f.url)).forEach(f => {
      allDocs.push({category: s.cat, name: f.name||s.cat, url: f.url, meta:''});
    });
  });

  const total = allDocs.length;

  if(!total){
    document.getElementById('tabContent').innerHTML = `
      <div style="background:var(--surface2);border-radius:var(--r);padding:2rem;text-align:center;color:var(--muted);font-size:13px">
        Belum ada dokumen tersedia untuk unit ini.
      </div>`;
    return;
  }

  const rows = allDocs.map((d,i) => `
    <tr style="border-bottom:1px solid var(--border)${i%2===0?';background:var(--surface2)':''}">
      <td style="padding:10px 14px;font-size:12px;color:var(--muted);white-space:nowrap">${d.category}</td>
      <td style="padding:10px 14px">
        <div style="font-size:13px;font-weight:500;color:var(--text);word-break:break-word">${d.name}</div>
        ${d.meta?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${d.meta}</div>`:''}
      </td>
      <td style="padding:10px 14px;text-align:right;white-space:nowrap">
        <a href="${d.url}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#e8621a;color:#fff;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none">
          ⬇ Download
        </a>
      </td>
    </tr>`).join('');

  document.getElementById('tabContent').innerHTML = `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--text)">Document Download Portal</div>
          ${customerName?`<div style="font-size:11px;color:var(--muted);margin-top:2px">Customer: <strong>${customerName}</strong></div>`:''}
        </div>
        <span style="font-size:11px;background:var(--primary-bg,#e8f4ff);color:var(--primary);padding:3px 9px;border-radius:12px;font-weight:600">${total} dokumen</span>
      </div>
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="background:#1a2332;color:#fff">
            <th style="padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.07em;text-align:left;white-space:nowrap">KATEGORI</th>
            <th style="padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.07em;text-align:left">JUDUL</th>
            <th style="padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.07em;text-align:right">DOWNLOAD</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}


function monitoringSerial(){
  const raw=currentUnit?.serial_number || document.getElementById('snInput')?.value || currentItem?.serial_number || '';
  return String(raw).split(',')[0].trim().toUpperCase();
}

function stopMonitoringRefresh(){
  if(monitorState.refreshTimer){clearInterval(monitorState.refreshTimer);monitorState.refreshTimer=null;}
}

function startMonitoringRefresh(){
  stopMonitoringRefresh();
  if(!monitorState.before){
    monitorState.refreshTimer=setInterval(()=>{
      if(document.getElementById('monitorCanvas')) loadMonitoring(false);
      else stopMonitoringRefresh();
    },15000);
  }
}

function monitorFmt(value,digits=1){
  const n=Number(value);
  return Number.isFinite(n)?n.toLocaleString('id-ID',{maximumFractionDigits:digits}):'—';
}

function monitorTime(value){
  if(!value)return '—';
  const d=new Date(value);
  return Number.isNaN(d.getTime())?'—':d.toLocaleString('id-ID');
}

function monitorEscape(value=''){
  return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function renderMonitoring(){
  monitorState.before=null;
  monitorState.data=null;
  monitorState.selectedKey=null;
  document.getElementById('tabContent').innerHTML=`
    <div class="section">
      <div class="sect-title">Panel Vision Monitoring</div>
      <div class="monitor-toolbar">
        <div class="monitor-toolbar-group">
          <select class="monitor-select" id="monitorRange" aria-label="Rentang monitoring">
            <option value="1">1 jam</option><option value="12">12 jam</option><option value="24">24 jam</option>
          </select>
          <select class="monitor-select" id="monitorSeries" aria-label="Parameter grafik"></select>
        </div>
        <div class="monitor-toolbar-group">
          <button class="monitor-btn" id="monitorPrev">← Sebelumnya</button>
          <button class="monitor-btn" id="monitorNext">Berikutnya →</button>
          <button class="monitor-btn primary" id="monitorNow">Sekarang</button>
        </div>
      </div>
      <div id="monitorBody"><div class="loading">Memuat data monitoring...</div></div>
    </div>`;

  document.getElementById('monitorRange').value=String(monitorState.hours);
  document.getElementById('monitorRange').onchange=e=>{
    monitorState.hours=Number(e.target.value)||1;
    monitorState.before=null;
    loadMonitoring(true);
  };
  document.getElementById('monitorSeries').onchange=e=>{
    monitorState.selectedKey=e.target.value;
    drawMonitoringChart();
  };
  document.getElementById('monitorPrev').onclick=()=>{
    if(!monitorState.data?.window?.from)return;
    monitorState.before=monitorState.data.window.from;
    loadMonitoring(true);
  };
  document.getElementById('monitorNext').onclick=()=>{
    if(!monitorState.before||!monitorState.data?.window?.to)return;
    const nextEnd=new Date(monitorState.data.window.to).getTime()+monitorState.hours*3600000;
    monitorState.before=nextEnd>=Date.now()-30000?null:new Date(nextEnd).toISOString();
    loadMonitoring(true);
  };
  document.getElementById('monitorNow').onclick=()=>{
    monitorState.before=null;
    loadMonitoring(true);
  };
  loadMonitoring(true);
}

async function loadMonitoring(showLoading=true){
  const serial=monitoringSerial();
  if(!serial){
    document.getElementById('monitorBody').innerHTML='<div class="monitor-error">Serial number unit tidak tersedia.</div>';
    return;
  }
  if(monitorState.loading)return;
  monitorState.loading=true;
  if(showLoading)document.getElementById('monitorBody').innerHTML='<div class="loading">Memuat data monitoring...</div>';
  try{
    const params=new URLSearchParams({hours:String(monitorState.hours)});
    if(monitorState.before)params.set('before',monitorState.before);
    const response=await fetch(`${PANELVISION_PUBLIC_URL}/${encodeURIComponent(serial)}?${params}`);
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);
    monitorState.data=data;
    const keys=new Set((data.registers||[]).map(r=>r.key));
    if(!monitorState.selectedKey||!keys.has(monitorState.selectedKey)){
      monitorState.selectedKey=(data.registers||[]).find(r=>r.key==='dc_load_voltage')?.key || data.registers?.[0]?.key || null;
    }
    renderMonitoringData();
    startMonitoringRefresh();
  }catch(error){
    document.getElementById('monitorBody').innerHTML=`<div class="monitor-error"><strong>Monitoring belum dapat ditampilkan.</strong><br>${monitorEscape(error.message)}</div>`;
    stopMonitoringRefresh();
  }finally{
    monitorState.loading=false;
  }
}

function renderMonitoringData(){
  const data=monitorState.data;
  if(!data)return;
  const latestRegs=new Map((data.latest?.telemetry?.registers||[]).map(r=>[r.key,r]));
  const status=data.status||{};
  const stale=Boolean(status.stale);
  const statusText=status.online?'ONLINE':stale?'OFFLINE / DATA LAMA':'OFFLINE';
  const statusClass=status.online?'ok':stale?'warn':'bad';
  const metricHtml=(data.registers||[]).map(def=>{
    const reg=latestRegs.get(def.key);
    return `<div class="monitor-card"><div class="monitor-card-label">${monitorEscape(def.name)}</div><div class="monitor-card-value">${monitorFmt(reg?.value,2)}<span class="monitor-card-unit">${monitorEscape(def.unit||'')}</span></div></div>`;
  }).join('');

  document.getElementById('monitorBody').innerHTML=`
    <div class="monitor-status-row">
      <div class="monitor-pill"><span class="monitor-dot ${statusClass}"></span>${statusText}</div>
      <div class="monitor-pill"><span class="monitor-dot ${status.modbus_ok?'ok':'bad'}"></span>${status.modbus_ok?'MODBUS OK':'MODBUS OFFLINE'}</div>
      <div class="monitor-pill">Data terakhir: ${monitorTime(data.latest?.captured_at||status.last_seen)}</div>
    </div>
    <div class="monitor-metrics">${metricHtml||'<div class="monitor-empty">Belum ada parameter monitoring.</div>'}</div>
    <div class="monitor-chart-card">
      <div class="monitor-chart-head">
        <div><div class="monitor-chart-title">Trend Historis</div><div class="monitor-window" id="monitorWindow"></div></div>
        <div class="monitor-window" id="monitorSampleCount"></div>
      </div>
      <div class="monitor-canvas-wrap"><canvas id="monitorCanvas"></canvas></div>
      <div class="monitor-note">Grafik memakai serial number unit yang sedang dibuka. Data offline tetap menampilkan pembacaan terakhir, sedangkan grafik mengikuti periode yang dipilih.</div>
    </div>`;

  const series=document.getElementById('monitorSeries');
  series.innerHTML=(data.registers||[]).map(def=>`<option value="${monitorEscape(def.key)}">${monitorEscape(def.name)}${def.unit?` (${monitorEscape(def.unit)})`:''}</option>`).join('');
  if(monitorState.selectedKey)series.value=monitorState.selectedKey;
  document.getElementById('monitorRange').value=String(monitorState.hours);
  document.getElementById('monitorNext').disabled=!monitorState.before;
  document.getElementById('monitorNow').disabled=!monitorState.before;
  document.getElementById('monitorWindow').textContent=`${monitorTime(data.window?.from)} – ${monitorTime(data.window?.to)}`;
  document.getElementById('monitorSampleCount').textContent=`${(data.history||[]).length.toLocaleString('id-ID')} sampel`;
  requestAnimationFrame(drawMonitoringChart);
}

function drawMonitoringChart(){
  const canvas=document.getElementById('monitorCanvas');
  const data=monitorState.data;
  if(!canvas||!data)return;
  const rect=canvas.getBoundingClientRect();
  if(rect.width<20||rect.height<20)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);
  const def=(data.registers||[]).find(r=>r.key===monitorState.selectedKey)||data.registers?.[0];
  if(!def)return;
  const from=new Date(data.window.from).getTime(),to=new Date(data.window.to).getTime();
  const points=(data.history||[]).map(row=>({t:new Date(row.captured_at).getTime(),v:Number(row.values?.[def.key])})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v));
  if(!monitorState.before&&data.latest?.captured_at){
    const latest=(data.latest.telemetry?.registers||[]).find(r=>r.key===def.key);
    const t=new Date(data.latest.captured_at).getTime(),v=Number(latest?.value);
    if(Number.isFinite(t)&&Number.isFinite(v)&&t>=from&&t<=to)points.push({t,v});
  }
  points.sort((a,b)=>a.t-b.t);
  const margin={left:58,right:16,top:18,bottom:38},pw=w-margin.left-margin.right,ph=h-margin.top-margin.bottom;
  ctx.font='10px DM Sans, sans-serif';ctx.lineWidth=1;
  const vals=points.map(p=>p.v);let min=vals.length?Math.min(...vals):0,max=vals.length?Math.max(...vals):1;
  if(min>=0)min=0;else min*=1.1;if(max<=min)max=min+1;else max*=1.1;
  for(let i=0;i<=5;i++){
    const y=margin.top+ph*i/5;ctx.strokeStyle='#e6e6e6';ctx.beginPath();ctx.moveTo(margin.left,y);ctx.lineTo(w-margin.right,y);ctx.stroke();
    const value=max-(max-min)*i/5;ctx.fillStyle='#666';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(`${monitorFmt(value,1)} ${def.unit||''}`,margin.left-7,y);
  }
  for(let i=0;i<=5;i++){
    const x=margin.left+pw*i/5;ctx.strokeStyle='#f0f0f0';ctx.beginPath();ctx.moveTo(x,margin.top);ctx.lineTo(x,h-margin.bottom);ctx.stroke();
    const d=new Date(from+(to-from)*i/5);ctx.fillStyle='#666';ctx.textAlign=i===0?'left':i===5?'right':'center';ctx.textBaseline='top';ctx.fillText(d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),x,h-margin.bottom+9);
  }
  if(points.length){
    ctx.strokeStyle='#1a7a3c';ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
    points.forEach((p,i)=>{const x=margin.left+(p.t-from)/(to-from)*pw,y=margin.top+(max-p.v)/(max-min)*ph;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  }else{
    ctx.fillStyle='#777';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='13px DM Sans, sans-serif';ctx.fillText('Tidak ada data pada periode ini',margin.left+pw/2,margin.top+ph/2);
  }
}

window.addEventListener('resize',()=>{if(document.getElementById('monitorCanvas'))requestAnimationFrame(drawMonitoringChart);});

let remoteHmiResizeListenerBound=false;
function setupRemoteHmiFrame(){
  const frame=document.getElementById('remoteHmiFrame');
  if(!frame)return;
  if(!remoteHmiResizeListenerBound){
    window.addEventListener('message',event=>{
      const active=document.getElementById('remoteHmiFrame');
      if(!active||event.source!==active.contentWindow||event.data?.type!=='remote-hmi:height')return;
      const next=Math.max(440,Math.min(5000,Number(event.data.height)||0));
      if(next)active.style.height=`${Math.ceil(next)}px`;
    });
    remoteHmiResizeListenerBound=true;
  }
}
