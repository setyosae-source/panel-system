<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:60px;background:#09141e;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:10}.brand{font-weight:800;letter-spacing:.07em}.brand b{color:#f12d2d}.unit{color:var(--muted);font:12px ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:6px 10px;border-radius:999px;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#617080}.dot.ok{background:var(--green);box-shadow:0 0 10px #23c48388}.dot.bad{background:var(--red)}.dot.warn{background:var(--amber);box-shadow:0 0 8px #f59e0b66}button{font:inherit}.btn{border:1px solid var(--line);background:#122333;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}.btn:hover{border-color:#3d617d}.btn.primary{background:#145b8f;border-color:#2079b6}.btn.danger{background:#581b24;border-color:#8f2936}.btn:disabled{opacity:.42;cursor:not-allowed}.nav{display:flex;gap:4px;padding:8px 12px;background:#0a1520;border-bottom:1px solid var(--line);overflow-x:auto}.nav button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:650}.nav button.active{background:#132536;color:var(--white)}.nav button.locked:after{content:' 🔒';font-size:10px}.main{width:min(1180px,100%);margin:0 auto;padding:16px}.card{background:linear-gradient(180deg,var(--panel),#0b1620);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#a9c3d6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}.metric.stale{border-color:#6c5522;background:#171d21}.metric.stale .value{color:#ffd67a}.metric .name{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.metric .value{font-size:26px;font-weight:750;margin-top:4px}.metric .unit{font-size:11px;margin-left:3px}.hint{color:var(--muted);font-size:12px}.error{background:#35151b;border:1px solid #74303b;color:#ffc8cf;padding:11px;border-radius:9px}.notice{background:#10283a;border:1px solid #235477;color:#cfeaff;padding:11px;border-radius:9px}.success{background:#103126;border:1px solid #236b4e;color:#ccffe9;padding:11px;border-radius:9px}.stale-banner{background:#382b10;border:1px solid #765b20;color:#ffe1a0;padding:10px 12px;border-radius:9px;margin-bottom:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.select,.input{background:#0a1621;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;outline:none}.input{width:100%}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.locked-panel{padding:28px;text-align:center}.locked-panel .big{font-size:34px;margin-bottom:8px}.mimic{display:grid;grid-template-columns:1fr 80px 1fr 80px 1fr;align-items:center;gap:8px;min-height:220px}.mnode{border:1px solid var(--line);background:#10202d;border-radius:12px;padding:18px;text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center}.mnode .icon{font-size:30px}.mnode .title{font-weight:800;margin-top:5px}.mnode .sub{font-size:11px;color:var(--muted);margin-top:3px}.wire{height:4px;background:#334759;position:relative;border-radius:4px}.wire.live{background:var(--green);box-shadow:0 0 9px #23c48366}.wire.live:after{content:'▶';position:absolute;right:-3px;top:-9px;color:var(--green)}.wire.stale{background:#6d5727}.battery-row{display:grid;grid-template-columns:1fr 80px 1fr;gap:8px;align-items:center;margin-top:12px}.status-list{display:flex;gap:7px;flex-wrap:wrap}.relay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.relay{display:flex;align-items:center;justify-content:space-between;background:#101e2a;border:1px solid var(--line);border-radius:9px;padding:10px}.lamp{width:10px;height:10px;border-radius:50%;background:#4b5965}.lamp.on{background:var(--green);box-shadow:0 0 8px #23c48388}.lamp.stale{background:var(--amber);box-shadow:0 0 8px #f59e0b55}.event{display:grid;grid-template-columns:155px 90px 1fr 95px;gap:10px;border-bottom:1px solid #1b2e3d;padding:10px 0;align-items:center}.sev{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;text-align:center}.sev.alarm,.sev.critical{color:#ff9eaa;border-color:#7f3040}.sev.warning{color:#ffd67a;border-color:#7a5b1f}.chart-wrap{height:310px;background:#091520;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block}.trend-scroll{height:18px;overflow-x:auto;overflow-y:hidden;margin-top:8px;border-radius:8px;background:#0a1621;border:1px solid var(--line)}.trend-scroll-spacer{height:1px}.trend-range{display:flex;justify-content:space-between;gap:10px;margin-top:5px;color:var(--muted);font-size:10px}.trend-live{color:#89ffd0;font-weight:700}.trend-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:#0a1621;border:1px solid var(--line);border-radius:8px}.trend-controls label{font-size:10px;color:var(--muted);white-space:nowrap}.trend-controls input[type=range]{flex:1;min-width:180px}.trend-y-value{min-width:145px;text-align:right;font:11px ui-monospace,Consolas,monospace;color:#b8d8eb}.trend-zoom-label{font-size:10px;color:var(--muted)}.login-modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.login-modal.show{display:flex}.login-box{width:min(410px,100%);background:#0d1b27;border:1px solid #31506a;border-radius:14px;padding:18px}.login-box h2{margin:0 0 6px}.login-actions{display:flex;gap:8px;margin-top:12px}.foot{color:#5f7688;font-size:10px;text-align:center;padding:14px}.role{color:#b8d8eb;font-weight:700}.control-row{display:flex;gap:8px;flex-wrap:wrap}.danger-zone{border-color:#63313a;background:#1c1015}.tiny{font-size:10px;color:var(--muted)}
.nav{position:sticky;top:60px;z-index:9;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}

  .event{grid-template-columns:1fr 72px}.event .msg{grid-column:1/-1}.event .state{display:none}
}

  .mimic{grid-template-columns:1fr;gap:8px;min-height:0}.mimic .load-wire,.mimic .load-node{display:block}
  .mimic>.wire,.battery-row>.wire{width:4px;height:30px;margin:0 auto}
  .mimic>.wire.live:after,.battery-row>.wire.live:after{content:'▼';right:-6px;top:auto;bottom:-12px}
  .battery-row{grid-template-columns:1fr;gap:8px}.mnode{min-height:88px;padding:13px}.mnode .icon{font-size:26px}
  .chart-wrap{height:270px}.trend-controls input[type=range]{min-width:150px}.trend-y-value{width:100%;min-width:0;text-align:left}
}

<body>
<div class="app">
  <div class="top">
    <div class="brand"><b>SAE</b> ENERGY · PANEL VISION</div>
    <div class="unit" id="unitText">SN: —</div>
    <div class="spacer"></div>

  <main class="main" id="view"><div class="card">Memuat Remote HMI…</div></main>
  <div class="foot">SAE Energy · Remote HMI · write command dikunci sampai command bridge terverifikasi</div>

<div class="login-modal" id="loginModal">
  <div class="login-box">
    <h2>Login Remote HMI</h2>
    <div class="hint" style="margin-bottom:12px">Login diperlukan untuk Events dan menu teknis sesuai hak akses.</div>
    <div class="field"><label>Email</label><input class="input" id="loginEmail" type="email" autocomplete="username"></div>
    <div class="field" style="margin-top:9px"><label>Password</label><input class="input" id="loginPassword" type="password" autocomplete="current-password"></div>
    <div id="loginMsg" style="margin-top:10px"></div>
    <div class="login-actions"><button class="btn primary" id="loginSubmit">Login</button><button class="btn" id="loginCancel">Batal</button></div>
  </div>
</div>

<script>
const SB_URL='https://sswslwddemackxrrbpre.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzd3Nsd2RkZW1hY2t4cnJicHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTE2MjcsImV4cCI6MjA5MTMyNzYyN30.aQivrCTGvzJ6-_OLUOUvFjOcu7qQ53Ajv2urvLZb9xg';
const PUBLIC_MONITOR='https://panelvision.ubnb.pw/public/monitor';
const DATA_LAMA_MS=5*60*1000;      // 5 menit sejak last-good data
const OFFLINE_MS=5*60*1000;         // 5 menit tanpa update gateway sama sekali
const REALTIME_RECONNECT_MS=15000;  // watchdog socket
const FALLBACK_CHECK_MS=5000;
const FALLBACK_HTTP_MIN_MS=10000;
const sb=supabase.createClient(SB_URL,SB_KEY);
const qs=new URLSearchParams(location.search);
const serial=(qs.get('sn')||qs.get('serial')||'').trim().toUpperCase();
const embedded=qs.get('embed')==='1';
if(embedded)document.body.classList.add('embed');
const state={
  tab:'mimic',monitor:null,panel:null,user:null,membership:null,access:null,
  timer:null,hours:1,series:null,commandBridge:false,lastGood:{},
  realtimeChannel:null,realtimeStatus:'INIT',lastRealtimeAt:0,lastHttpAt:0,
  trendWindowMs:5*60*1000,trendFollowLive:true,trendEndTime:null,trendScrollBusy:false,
  trendYMinPct:100
};
const menu=[['mimic','Mimic'],['monitoring','Monitoring'],['settings','Settings'],['relays','Relays'],['events','Events'],['calibration','Calibration']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toNum=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const fmt=(v,d=1)=>{const n=toNum(v);return n===null?'—':n.toLocaleString('id-ID',{maximumFractionDigits:d})};
const time=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('id-ID')};
const ageText=ms=>{const n=toNum(ms);if(n===null)return '—';if(n<1000)return `${Math.round(n)} ms`;if(n<60000)return `${(n/1000).toFixed(1)} dtk`;return `${(n/60000).toFixed(1)} mnt`};
function regs(){return new Map((state.monitor?.latest?.telemetry?.registers||[]).map(r=>[r.key,r]));}
function regObj(key){return regs().get(key)||null;}
function status(){return state.monitor?.status||{};}
function telemetryModbus(){return state.monitor?.latest?.telemetry?.modbus||{};}
function qualityOf(r){return String(r?.quality||'').toLowerCase();}
function readableReg(r){return !!r&&r.value!==null&&r.value!==undefined&&qualityOf(r)!=='bad';}
function goodReg(r){return readableReg(r)&&qualityOf(r)!=='stale';}
function goodCapturedAt(data=state.monitor){
  const at=data?.latest?.captured_at||data?.status?.last_seen||null;
  const age=toNum(data?.latest?.telemetry?.modbus?.data_age_ms);
  if(!at||age===null)return at;
  const t=new Date(at).getTime();
  return Number.isFinite(t)?new Date(t-age).toISOString():at;
}
function dataFreshness(){
  const s=status(),m=telemetryModbus();
  const baseAge=toNum(m.data_age_ms)||0;
  const updatedAt=state.monitor?.latest?.updated_at||state.monitor?.latest?.captured_at||s.last_seen||null;
  const updatedMs=updatedAt?new Date(updatedAt).getTime():NaN;
  const transportAge=Number.isFinite(updatedMs)?Math.max(0,Date.now()-updatedMs):0;

  // data_age_ms berasal dari firmware dan menunjukkan umur LAST GOOD VALUE.
  // Poll timeout sesaat tidak dianggap DATA LAMA.
  const age=baseAge+transportAge;
  const offline=s.online===false||transportAge>OFFLINE_MS;
  const stale=!offline&&age>DATA_LAMA_MS;

  return {
    stale,offline,age_ms:age,transport_age_ms:transportAge,
    last_poll_ok:m.last_poll_ok,poll_success_pct:toNum(m.poll_success_pct)
  };
}
function rememberLastGood(data){
  const latestAt=goodCapturedAt(data);
  for(const r of (data?.latest?.telemetry?.registers||[])){
    if(goodReg(r))state.lastGood[r.key]={value:r.value,captured_at:latestAt};
  }
  const history=[...(data?.history||[])].sort((a,b)=>new Date(b.captured_at)-new Date(a.captured_at));
  for(const row of history){
    for(const def of (data?.registers||[])){
      if(state.lastGood[def.key])continue;
      const v=row?.values?.[def.key];
      if(v!==null&&v!==undefined&&v!=='')state.lastGood[def.key]={value:v,captured_at:row.captured_at};
    }
  }
}
function regMeta(key){
  const r=regObj(key),s=status(),fresh=dataFreshness();
  if(readableReg(r)){
    return {
      value:r.value,
      stale:fresh.stale,
      captured_at:fresh.stale?goodCapturedAt():state.monitor?.latest?.captured_at||s.last_seen||null,
      source:fresh.stale?'last-good-5min':'latest'
    };
  }
  const last=state.lastGood[key];
  if(last)return {value:last.value,stale:fresh.stale,captured_at:last.captured_at||null,source:'last-good'};
  return {value:null,stale:fresh.stale,captured_at:null,source:'none'};
}
function reg(key){return regMeta(key).value;}
function isOwner(){return state.membership?.role==='owner';}
function perms(){
  if(isOwner())return {monitor:true,events:true,settings:true,relays:true,calibration:true,control:true,role:'owner'};
  const a=state.access||{};
  return {monitor:a.can_monitor!==false,events:!!a.can_events,settings:!!a.can_settings,relays:!!a.can_relays,calibration:!!a.can_calibration,control:!!a.can_control,role:a.access_role||'public'};
}
function tabAllowed(id){const p=perms();if(id==='mimic'||id==='monitoring')return true;if(id==='events')return !!state.user&&p.events;return !!state.user&&!!p[id];}
function buildNav(){
  const visibleMenu=state.user?menu:menu.filter(([id])=>id==='mimic'||id==='monitoring');
  $('nav').innerHTML=visibleMenu.map(([id,label])=>`<button data-tab="${id}" class="${state.tab===id?'active ':''}${tabAllowed(id)?'':'locked'}">${label}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
}
function openTab(id){
  if(!tabAllowed(id)){showLogin(`Akses ${menu.find(x=>x[0]===id)?.[1]||id} memerlukan login/permission.`);return;}
  state.tab=id;buildNav();render();
}
function setConnection(){
  const fresh=dataFreshness();
  $('connDot').className='dot '+(fresh.offline?'bad':fresh.stale?'warn':'ok');
  const statusText=fresh.offline?'OFFLINE':fresh.stale?'DATA LAMA':'ONLINE';
  const transport=(!fresh.offline&&!fresh.stale)?(state.realtimeStatus==='SUBSCRIBED'?' · LIVE':' · FALLBACK'):'';
  $('connText').textContent=statusText+transport;
}
async function loadPublic(){
  if(!serial){$('view').innerHTML='<div class="card error">Serial number belum diberikan. Gunakan <b>?sn=SERIAL</b>.</div>';return;}
  try{
    const r=await fetch(`${PUBLIC_MONITOR}/${encodeURIComponent(serial)}?hours=${state.hours}`);
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);
    state.monitor=d;
    state.lastHttpAt=Date.now();
    if(state.monitor?.latest&&!state.monitor.latest.updated_at){
      state.monitor.latest.updated_at=state.monitor.latest.captured_at||state.monitor?.status?.last_seen||null;
    }
    rememberLastGood(d);
    if(!state.series)state.series=(d.registers||[]).find(x=>x.key==='dc_load_voltage')?.key||d.registers?.[0]?.key||null;
    setConnection();render();
  }catch(e){$('view').innerHTML=`<div class="card error">Monitoring gagal: ${esc(e.message)}</div>`;$('connDot').className='dot bad';$('connText').textContent='ERROR';}
}

function rowValues(row){
  const out={};
  for(const r of (row?.telemetry?.registers||[])){
    if(r?.key!==undefined&&r?.value!==undefined&&r?.value!==null)out[r.key]=r.value;
  }
  return out;
}
function appendRealtimeHistory(row){
  if(!state.monitor)return;
  if(!Array.isArray(state.monitor.history))state.monitor.history=[];
  const at=row?.captured_at||row?.updated_at;
  if(!at)return;
  const key=String(at);
  const values=rowValues(row);
  const last=state.monitor.history[state.monitor.history.length-1];
  if(last&&String(last.captured_at)===key){
    last.values={...(last.values||{}),...values};
  }else{
    state.monitor.history.push({captured_at:at,values});
    const cutoff=Date.now()-Math.max(1,state.hours)*3600000;
    state.monitor.history=state.monitor.history
      .filter(x=>new Date(x.captured_at).getTime()>=cutoff)
      .slice(-5000);
  }
}
function applyRealtimeRow(row){
  if(!row||String(row.serial_number||'').toUpperCase()!==serial||!state.monitor)return;
  const oldLatest=state.monitor.latest||{};
  state.monitor.latest={
    ...oldLatest,
    captured_at:row.captured_at||oldLatest.captured_at||null,
    updated_at:row.updated_at||row.captured_at||new Date().toISOString(),
    charger_mode:row.charger_mode??oldLatest.charger_mode??null,
    telemetry:row.telemetry||oldLatest.telemetry||{registers:[],modbus:{}}
  };
  state.monitor.status={
    ...(state.monitor.status||{}),
    online:true,
    stale:false,
    modbus_ok:row.modbus_ok!==false,
    last_seen:row.updated_at||row.captured_at||new Date().toISOString()
  };
  state.lastRealtimeAt=Date.now();
  appendRealtimeHistory(row);
  rememberLastGood(state.monitor);
  if(state.trendFollowLive){
    state.trendEndTime=row.captured_at?new Date(row.captured_at).getTime():Date.now();
  }
  setConnection();
  render();
}
function startRealtime(){
  if(!serial)return;
  if(state.realtimeChannel){
    try{sb.removeChannel(state.realtimeChannel)}catch(_){}
    state.realtimeChannel=null;
  }
  state.realtimeStatus='CONNECTING';
  const channelName=`pv-public-${serial}-${Math.random().toString(36).slice(2,8)}`;
  state.realtimeChannel=sb
    .channel(channelName)
    .on(
      'postgres_changes',
      {event:'*',schema:'public',table:'pv_public_live',filter:`serial_number=eq.${serial}`},
      payload=>applyRealtimeRow(payload.new)
    )
    .subscribe(st=>{
      state.realtimeStatus=st;
      setConnection();
      if(st==='SUBSCRIBED'){
        state.lastRealtimeAt=Date.now();
      }
    });
}
async function realtimeWatchdog(){
  if(!state.monitor)return;
  const fresh=dataFreshness();
  setConnection();

  // UI baru menampilkan DATA LAMA setelah last-good > 5 menit.
  if((fresh.stale||fresh.offline)&&document.visibilityState==='visible'){
    render();
  }

  // Socket boleh direconnect lebih cepat tanpa mempengaruhi status DATA LAMA di UI.
  const rtSilent=state.realtimeStatus!=='SUBSCRIBED'||
    (state.lastRealtimeAt>0&&Date.now()-state.lastRealtimeAt>REALTIME_RECONNECT_MS);

  if(rtSilent&&document.visibilityState==='visible'&&Date.now()-state.lastHttpAt>FALLBACK_HTTP_MIN_MS){
    await loadPublic();
  }

  if(state.realtimeStatus==='CLOSED'||state.realtimeStatus==='CHANNEL_ERROR'||state.realtimeStatus==='TIMED_OUT'||
     (state.lastRealtimeAt>0&&Date.now()-state.lastRealtimeAt>REALTIME_RECONNECT_MS)){
    startRealtime();
  }
}

async function loadSecure(){
  const {data:{session}}=await sb.auth.getSession();state.user=session?.user||null;
  if(!state.user){state.panel=state.membership=state.access=null;updateAuth();buildNav();return;}
  const {data:p}=await sb.from('pv_panels').select('id,organization_id,gateway_id,name,model,serial_number,binding_type,binding_label,device_profile,active').eq('serial_number',serial).maybeSingle();
  state.panel=p||null;
  if(p){
    const [{data:m},{data:a}]=await Promise.all([
      sb.from('pv_memberships').select('role').eq('organization_id',p.organization_id).eq('user_id',state.user.id).maybeSingle(),
      sb.from('pv_panel_access').select('*').eq('panel_id',p.id).eq('user_id',state.user.id).maybeSingle()
    ]);
    state.membership=m||null;state.access=a||null;
  }
  updateAuth();buildNav();render();
}
function updateAuth(){
  $('authBtn').textContent=state.user?`Logout · ${perms().role}`:'Login';
  $('authBtn').onclick=async()=>{if(state.user){await sb.auth.signOut();state.user=state.panel=state.membership=state.access=null;state.tab='mimic';updateAuth();buildNav();render();}else showLogin();};
}
function showLogin(msg=''){$('loginModal').classList.add('show');$('loginMsg').innerHTML=msg?`<div class="notice">${esc(msg)}</div>`:'';setTimeout(()=>$('loginEmail').focus(),50)}
function hideLogin(){$('loginModal').classList.remove('show');$('loginPassword').value=''}
$('loginCancel').onclick=hideLogin;
$('loginSubmit').onclick=async()=>{
  const email=$('loginEmail').value.trim(),password=$('loginPassword').value;
  $('loginSubmit').disabled=true;$('loginMsg').innerHTML='<div class="hint">Login…</div>';
  const {error}=await sb.auth.signInWithPassword({email,password});$('loginSubmit').disabled=false;
  if(error){$('loginMsg').innerHTML=`<div class="error">${esc(error.message)}</div>`;return;}
  hideLogin();await loadSecure();
};
function render(){
  if(!state.monitor)return;
  if(state.tab==='monitoring'&&$('chart')&&$('trendScroll')){
    // update metric cards + graph without rebuilding scrollbar / losing user's historical position
    const grid=$('view').querySelector('.grid');
    if(grid)grid.innerHTML=metricCards();
    setupTrendScroll(false);
    drawChart();
    return;
  }
  ({mimic:renderMimic,monitoring:renderMonitoring,settings:renderSettings,relays:renderRelays,events:renderEvents,calibration:renderCalibration}[state.tab]||renderMimic)();
}
function node(icon,title,sub,nodeState='unknown'){const active=nodeState==='active',off=nodeState==='off',stale=nodeState==='stale';const dotClass=active?'ok':off?'bad':'warn';const label=active?'ACTIVE':off?'OFF':stale?'DATA LAMA':'UNKNOWN';return `<div class="mnode"><div class="icon">${icon}</div><div class="title">${title}</div><div class="sub">${sub}</div><div class="status-list" style="justify-content:center;margin-top:7px"><span class="pill"><span class="dot ${dotClass}"></span>${label}</span></div></div>`}
function statusPill(label,on,stale){const cls=stale?'warn':on?'ok':'bad';const text=stale?'DATA LAMA':on?'ON':'OFF';return `<span class="pill"><span class="dot ${cls}"></span>${esc(label)}: ${text}</span>`}
function renderMimic(){
  const acM=regMeta('ac_voltage_l1'),freqM=regMeta('frequency'),dcM=regMeta('dc_load_voltage'),loadIM=regMeta('dc_load_current'),batM=regMeta('battery_voltage'),batIM=regMeta('battery_current'),highM=regMeta('led_high16'),lowM=regMeta('led_low16');
  const ac=toNum(acM.value),freq=toNum(freqM.value),dc=toNum(dcM.value),loadI=toNum(loadIM.value),bat=toNum(batM.value),batI=toNum(batIM.value),high=toNum(highM.value),low=toNum(lowM.value);
  const highValid=high!==null,lowValid=low!==null;
  const gridAnalog=ac!==null&&freq!==null&&ac>50&&freq>40;
  const grid=highValid?!!(high&0x80):gridAnalog;
  const batMcb=lowValid?!!(low&0x01):bat!==null&&bat>10;
  const loadMcb=lowValid?!!(low&0x02):dc!==null&&dc>10;
  const dcLive=dc!==null&&dc>10,batLive=bat!==null&&bat>10;
  const gridStale=acM.stale||freqM.stale||highM.stale,dcStale=dcM.stale||lowM.stale,batStale=batM.stale||lowM.stale,statusStale=highM.stale||lowM.stale;
  const gridState=(ac===null&&freq===null&&!highValid)?'unknown':gridStale?'stale':grid?'active':'off';
  const rectState=dc===null?'unknown':dcM.stale?'stale':dcLive?'active':'off';
  const loadState=(dc===null&&!lowValid)?'unknown':dcStale?'stale':(dcLive&&loadMcb)?'active':'off';
  const batState=(bat===null&&!lowValid)?'unknown':batStale?'stale':(batLive&&batMcb)?'active':'off';
  const mode=state.monitor?.latest?.charger_mode||'—',fresh=dataFreshness();
  const staleBanner=fresh.stale?`<div class="stale-banner"><b>DATA LAMA</b> · data valid terakhir sudah lebih dari 5 menit; nilai terakhir tetap ditampilkan. Age ${esc(ageText(fresh.age_ms))}; animasi aliran dihentikan sampai poll berikutnya berhasil.</div>`:'';
  $('view').innerHTML=`
  ${staleBanner}
  <div class="card"><h3>Mimic Diagram · ${esc(serial)}</h3>
    <div class="mimic">
      ${node('⚡','GRID',`${fmt(ac,1)} V · ${fmt(freq,1)} Hz`,gridState)}
      <div class="wire ${gridStale?'stale':grid?'live':''}"></div>
      ${node('▣','RECTIFIER',`Mode: ${esc(mode)}`,rectState)}
      <div class="wire load-wire ${dcStale?'stale':(dcLive&&loadMcb)?'live':''}"></div>
      <div class="load-node">${node('◉','LOAD',`${fmt(dc,1)} V · ${fmt(loadI,1)} A`,loadState)}</div>
    </div>
    <div class="battery-row">
      ${node('▥','BATTERY',`${fmt(bat,1)} V · ${fmt(batI,1)} A`,batState)}
      <div class="wire ${batStale?'stale':(batLive&&batMcb)?'live':''}"></div>
      <div class="mnode"><div class="title">SYSTEM STATUS</div><div class="sub">Gateway ${esc(state.monitor?.gateway?.id||state.monitor?.gateway_id||'—')}</div><div class="status-list" style="justify-content:center;margin-top:9px">${statusPill('GRID',grid,statusStale)}${statusPill('MCB LOAD',loadMcb,statusStale)}${statusPill('MCB BATTERY',batMcb,statusStale)}</div><div class="status-list" style="justify-content:center;margin-top:7px"><span class="pill">MODBUS: ${fresh.stale?'DATA LAMA':status().modbus_ok?'OK':'OFF'}</span><span class="pill">Age: ${esc(ageText(fresh.age_ms))}</span><span class="pill">Poll: ${fresh.poll_success_pct===null?'—':fmt(fresh.poll_success_pct,1)+'%'}</span></div></div>
    </div>
  </div>`;
}
function metricCards(){return (state.monitor?.registers||[]).map(d=>{const m=regMeta(d.key),has=m.value!==null&&m.value!==undefined;const note=!has?'DATA INVALID':m.stale?'DATA LAMA':'LIVE';return `<div class="metric ${m.stale?'stale':''}"><div class="name">${esc(d.name)}</div><div class="value">${fmt(m.value,2)}<span class="unit">${esc(d.unit||'')}</span></div><div class="tiny">${esc(d.key)} · ${note}${m.stale&&m.captured_at?` · valid ${esc(time(m.captured_at))}`:''}</div></div>`}).join('')}
function renderMonitoring(){
  const fresh=dataFreshness();
  const banner=fresh.stale?`<div class="stale-banner"><b>DATA LAMA</b> · data valid terakhir > 5 menit · Last Good Value dipertahankan · age ${esc(ageText(fresh.age_ms))}.</div>`:'';
  $('view').innerHTML=`${banner}<div class="card"><div class="toolbar"><h3 style="margin:0;flex:1">Live Monitoring</h3><select class="select" id="hours"><option value="1">1 jam</option><option value="12">12 jam</option><option value="24">24 jam</option></select><select class="select" id="series"></select><button class="btn" id="refresh">Refresh</button></div><div class="grid">${metricCards()}</div></div><div class="card"><h3>Trend Historis · Jendela 5 Menit</h3><div class="chart-wrap"><canvas id="chart"></canvas></div><div class="trend-scroll" id="trendScroll"><div class="trend-scroll-spacer" id="trendScrollSpacer"></div></div><div class="trend-range"><span id="trendFrom">—</span><span id="trendMode" class="trend-live">LIVE · 5 menit terbaru</span><span id="trendTo">—</span></div><div class="trend-controls"><label for="trendYMin">Y-Min · Zoom Y</label><span class="trend-zoom-label">0 / Zoom Out</span><input id="trendYMin" type="range" min="0" max="100" step="1" value="${state.trendYMinPct}"><span class="trend-zoom-label">Min data / Zoom In</span><span class="trend-y-value" id="trendYMinValue">—</span></div><div class="hint" id="chartInfo"></div></div>`;
  $('hours').value=String(state.hours);
  $('hours').onchange=async e=>{
    state.hours=Number(e.target.value)||1;
    state.trendFollowLive=true;
    state.trendEndTime=null;
    await loadPublic();
  };
  $('series').innerHTML=(state.monitor?.registers||[]).map(d=>`<option value="${esc(d.key)}">${esc(d.name)}${d.unit?` (${esc(d.unit)})`:''}</option>`).join('');
  $('series').value=state.series||'';
  $('series').onchange=e=>{state.series=e.target.value;drawChart()};
  $('refresh').onclick=loadPublic;

  const sc=$('trendScroll');
  sc.onscroll=()=>{
    if(state.trendScrollBusy)return;
    updateTrendFromScroll();
  };

  const yMinSlider=$('trendYMin');
  yMinSlider.value=String(state.trendYMinPct);
  yMinSlider.oninput=e=>{
    state.trendYMinPct=Math.max(0,Math.min(100,Number(e.target.value)||0));
    drawChart();
  };

  requestAnimationFrame(()=>{
    setupTrendScroll(true);
    drawChart();
  });
}

function getTrendAllPoints(){
  const def=(state.monitor?.registers||[]).find(x=>x.key===state.series);
  if(!def)return {def:null,pts:[]};
  const pts=(state.monitor?.history||[])
    .map(q=>({t:new Date(q.captured_at).getTime(),v:toNum(q.values?.[def.key])}))
    .filter(q=>Number.isFinite(q.t)&&q.v!==null)
    .sort((a,b)=>a.t-b.t);
  return {def,pts};
}

function setupTrendScroll(forceRight=false){
  const sc=$('trendScroll'),sp=$('trendScrollSpacer');
  if(!sc||!sp)return;
  const {pts}=getTrendAllPoints();
  if(!pts.length)return;

  const first=pts[0].t;
  const last=pts[pts.length-1].t;
  const total=Math.max(state.trendWindowMs,last-first);
  const windows=Math.max(1,total/state.trendWindowMs);

  // scrollbar cukup panjang untuk navigasi histori tanpa membuat canvas ratusan ribu pixel
  const viewport=Math.max(300,sc.clientWidth||800);
  const virtualWidth=Math.min(12000,Math.max(viewport+1,viewport*windows));
  sp.style.width=`${Math.round(virtualWidth)}px`;

  state.trendScrollBusy=true;
  if(forceRight||state.trendFollowLive){
    sc.scrollLeft=sc.scrollWidth-sc.clientWidth;
    state.trendFollowLive=true;
    state.trendEndTime=last;
  }else{
    const maxScroll=Math.max(1,sc.scrollWidth-sc.clientWidth);
    const endMin=first+state.trendWindowMs;
    const ratio=Math.max(0,Math.min(1,((state.trendEndTime||last)-endMin)/Math.max(1,last-endMin)));
    sc.scrollLeft=ratio*maxScroll;
  }
  requestAnimationFrame(()=>{state.trendScrollBusy=false});
}

function updateTrendFromScroll(){
  const sc=$('trendScroll');
  if(!sc)return;
  const {pts}=getTrendAllPoints();
  if(!pts.length)return;
  const first=pts[0].t,last=pts[pts.length-1].t;
  const maxScroll=Math.max(1,sc.scrollWidth-sc.clientWidth);
  const ratio=Math.max(0,Math.min(1,sc.scrollLeft/maxScroll));
  const endMin=Math.min(last,first+state.trendWindowMs);
  state.trendEndTime=endMin+ratio*Math.max(0,last-endMin);
  state.trendFollowLive=ratio>0.995;
  if(state.trendFollowLive)state.trendEndTime=last;
  drawChart();
}

function drawChart(){
  const c=$('chart');
  if(!c)return;

  const {def,pts:allPts}=getTrendAllPoints();
  if(!def)return;

  if(state.trendFollowLive&&allPts.length){
    state.trendEndTime=allPts[allPts.length-1].t;
    setupTrendScroll(false);
  }

  const latestT=allPts.length?allPts[allPts.length-1].t:Date.now();
  const end=Math.min(latestT,state.trendEndTime||latestT);
  const start=end-state.trendWindowMs;
  const pts=allPts.filter(p=>p.t>=start&&p.t<=end);

  const rect=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  c.width=Math.max(1,Math.round(rect.width*dpr));
  c.height=Math.max(1,Math.round(rect.height*dpr));
  const x=c.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);

  const w=rect.width,h=rect.height,m={l:58,r:15,t:18,b:35},pw=w-m.l-m.r,ph=h-m.t-m.b;
  x.clearRect(0,0,w,h);
  x.font='10px system-ui';
  x.fillStyle='#8ea4b6';

  const dataMin=pts.length?Math.min(...pts.map(p=>p.v)):0;
  let max=pts.length?Math.max(...pts.map(p=>p.v)):1;

  // Y-Min slider:
  // 0%   = baseline 0 (zoom out)
  // 100% = minimum nilai data yang sedang terlihat (zoom in)
  let min=dataMin*(state.trendYMinPct/100);

  // Jika semua data sama, tetap beri ruang vertikal.
  if(min===max){
    const pad=Math.max(Math.abs(max)*0.01,1);
    min-=pad;
    max+=pad;
  }

  // Hindari range terbalik/terlalu kecil akibat pembulatan atau data khusus.
  if(max-min<1e-9)max=min+1;

  const yMinText=$('trendYMinValue');
  if(yMinText){
    yMinText.textContent=`Y min ${fmt(min,2)} · data min ${fmt(dataMin,2)}`;
  }
  const ySlider=$('trendYMin');
  if(ySlider&&Number(ySlider.value)!==state.trendYMinPct){
    ySlider.value=String(state.trendYMinPct);
  }

  for(let i=0;i<=5;i++){
    const y=m.t+ph*i/5;
    x.strokeStyle='#203444';
    x.beginPath();x.moveTo(m.l,y);x.lineTo(w-m.r,y);x.stroke();
    x.textAlign='right';
    x.fillText(fmt(max-(max-min)*i/5,1),m.l-7,y+3);
  }

  // vertical grid every minute
  for(let i=0;i<=5;i++){
    const xx=m.l+pw*i/5;
    x.strokeStyle='#162a38';
    x.beginPath();x.moveTo(xx,m.t);x.lineTo(xx,m.t+ph);x.stroke();
    x.textAlign='center';
    const tt=new Date(start+state.trendWindowMs*i/5);
    x.fillStyle='#8ea4b6';
    x.fillText(tt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),xx,h-12);
  }

  if(pts.length){
    x.strokeStyle='#32d3e4';
    x.lineWidth=2;
    x.beginPath();
    pts.forEach((p,i)=>{
      const xx=m.l+(p.t-start)/state.trendWindowMs*pw;
      const yy=m.t+(max-p.v)/(max-min)*ph;
      i?x.lineTo(xx,yy):x.moveTo(xx,yy);
    });
    x.stroke();
  }else{
    x.textAlign='center';
    x.fillStyle='#8ea4b6';
    x.fillText('Tidak ada data pada rentang 5 menit ini',w/2,h/2);
  }

  const from=$('trendFrom'),to=$('trendTo'),mode=$('trendMode');
  if(from)from.textContent=new Date(start).toLocaleString('id-ID');
  if(to)to.textContent=new Date(end).toLocaleString('id-ID');
  if(mode){
    mode.textContent=state.trendFollowLive?'LIVE · 5 menit terbaru':'HISTORI · scroll ke kanan untuk kembali LIVE';
    mode.className=state.trendFollowLive?'trend-live':'';
  }
  if($('chartInfo'))$('chartInfo').textContent=`${def.name} · ${pts.length} sampel dalam 5 menit · total histori ${allPts.length} sampel · ${def.unit||''} · Y zoom ${state.trendYMinPct}%`;
}

function locked(title,need){$('view').innerHTML=`<div class="card locked-panel"><div class="big">🔒</div><h3>${esc(title)}</h3><div class="hint">Dibutuhkan login dengan izin <b>${esc(need)}</b>.</div><button class="btn primary" style="margin-top:14px" onclick="showLogin()">Login</button></div>`}
function writeState(){return state.commandBridge?'<div class="success">Command bridge aktif.</div>':'<div class="notice"><b>Write command belum diaktifkan.</b> Permission sudah diterapkan, tetapi pengiriman write ke ESP32 sengaja dikunci sampai format command firmware/server dipastikan.</div>'}
function renderSettings(){if(!tabAllowed('settings'))return locked('Settings','Settings');const p=perms();$('view').innerHTML=`<div class="card"><h3>Settings · role <span class="role">${esc(p.role)}</span></h3>${writeState()}<div class="form-grid" style="margin-top:12px"><div class="field"><label>Float Voltage</label><input class="input" value="" placeholder="Baca dari profile HMI" disabled></div><div class="field"><label>Boost Voltage</label><input class="input" value="" placeholder="Baca dari profile HMI" disabled></div><div class="field"><label>Current Limit</label><input class="input" value="" placeholder="Baca dari profile HMI" disabled></div><div class="field"><label>Device Profile</label><input class="input" value="${esc(state.panel?.device_profile||'—')}" disabled></div></div><div class="control-row" style="margin-top:12px"><button class="btn primary" disabled>Apply Setting</button></div></div><div class="card danger-zone"><h3>Rectifier Control</h3><div class="hint">Izin control: ${p.control?'YA':'TIDAK'}. Tombol tetap dikunci sampai command mapping diverifikasi.</div><div class="control-row" style="margin-top:10px"><button class="btn primary" disabled>RECTIFIER ON</button><button class="btn danger" disabled>RECTIFIER OFF</button></div></div>`}
function renderRelays(){if(!tabAllowed('relays'))return locked('Relays','Relays');const meta=regMeta('relay_outputs'),raw=toNum(meta.value),valid=raw!==null;const bits=Array.from({length:16},(_,i)=>valid?!!(raw&(1<<i)):false);$('view').innerHTML=`<div class="card"><h3>Relay Outputs</h3>${writeState()}${meta.stale?'<div class="stale-banner" style="margin-top:10px">Relay status menggunakan Last Good Value.</div>':''}<div class="relay-grid" style="margin-top:12px">${bits.map((on,i)=>`<div class="relay"><span>Relay ${i+1}</span><span><span class="lamp ${meta.stale?'stale':on?'on':''}"></span> ${valid?(on?'ON':'OFF'):'—'}${meta.stale?' · LAMA':''}</span></div>`).join('')}</div><div class="hint" style="margin-top:10px">Raw relay_outputs: ${valid?raw:'—'}</div></div>`}
async function renderEvents(){if(!tabAllowed('events'))return locked('Events','Events');$('view').innerHTML='<div class="card">Memuat event…</div>';if(!state.panel){$('view').innerHTML='<div class="card error">Panel tidak ditemukan pada akses user ini.</div>';return}const {data,error}=await sb.from('pv_alarm_events').select('id,code,severity,message,state,started_at,cleared_at,acknowledged_at').eq('panel_id',state.panel.id).order('started_at',{ascending:false}).limit(50);if(error){$('view').innerHTML=`<div class="card error">${esc(error.message)}</div>`;return}$('view').innerHTML=`<div class="card"><h3>Events · 50 terbaru</h3>${(data||[]).length?(data||[]).map(e=>`<div class="event"><div>${esc(time(e.started_at))}</div><div class="sev ${esc((e.severity||'').toLowerCase())}">${esc(e.severity||'—')}</div><div class="msg"><b>${esc(e.code)}</b> · ${esc(e.message)}</div><div class="state">${esc(e.state)}</div></div>`).join(''):'<div class="hint">Belum ada event.</div>'}</div>`}
function renderCalibration(){if(!tabAllowed('calibration'))return locked('Calibration','Calibration');const live=(state.monitor?.registers||[]).slice(0,12);$('view').innerHTML=`<div class="card"><h3>Calibration</h3>${writeState()}<div class="hint" style="margin:10px 0">Live value terus mengikuti monitoring. Measured value dan faktor kalibrasi belum dikirim ke ESP32 sampai command contract diverifikasi.</div><div class="form-grid">${live.map(d=>{const m=regMeta(d.key);return `<div class="field"><label>${esc(d.name)} · Live ${fmt(m.value,2)} ${esc(d.unit||'')}${m.stale?' · DATA LAMA':''}</label><input class="input" type="number" step="any" placeholder="Measured value" disabled></div>`}).join('')}</div><button class="btn primary" style="margin-top:12px" disabled>Save Calibration</button></div>`}
function reportEmbedHeight(){
  if(!embedded||window.parent===window)return;
  requestAnimationFrame(()=>{
    const app=document.querySelector('.app');
    const height=Math.max(app?.scrollHeight||0,document.body.scrollHeight||0)+2;
    window.parent.postMessage({type:'remote-hmi:height',height},location.origin);
  });
}
if(embedded){
  const observer=new ResizeObserver(reportEmbedHeight);
  observer.observe(document.querySelector('.app'));
  window.addEventListener('load',reportEmbedHeight);
}
async function init(){
  $('unitText').textContent=`SN: ${serial||'—'}`;
  buildNav();
  updateAuth();
  await loadPublic();
  await loadSecure();
  startRealtime();
  state.timer=setInterval(realtimeWatchdog,FALLBACK_CHECK_MS);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      realtimeWatchdog();
      if(state.realtimeStatus!=='SUBSCRIBED')startRealtime();
    }
  });
  sb.auth.onAuthStateChange(()=>setTimeout(loadSecure,0));
}
window.addEventListener('resize',()=>{if(state.tab==='monitoring')requestAnimationFrame(drawChart);reportEmbedHeight()});
init();
</script>
