<title>SAE Energy — Reset Password</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('panelvision-theme')==='light'?'light':'dark'}catch(_){document.documentElement.dataset.theme='dark'}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#071019;--panel:#0d1823;--panel2:#111f2d;--line:#294155;--text:#eaf2f8;--muted:#94aabd;--blue:#3ba7ff}html[data-theme=light]{--bg:#eef3f7;--panel:#fff;--panel2:#f5f8fa;--line:#b8cad7;--text:#142733;--muted:#506879;--blue:#146b9e;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.box{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 12px 36px #0003}.brand{font-weight:850;letter-spacing:.06em;margin-bottom:15px}.brand b{color:#ef3434}h1{margin:0 0 7px;font-size:23px}.muted{color:var(--muted)}.field{margin-top:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit;color:var(--text);background:var(--panel2);-webkit-text-fill-color:currentColor}.show-password{display:flex;align-items:center;gap:8px;margin-top:11px;color:var(--muted);font-size:13px;cursor:pointer}.show-password input{width:18px;height:18px;accent-color:var(--blue)}.btn{width:100%;margin-top:14px;border:1px solid #287fb2;border-radius:8px;background:#145b8f;color:#fff;padding:11px;font:700 15px system-ui;cursor:pointer;text-decoration:none;display:block;text-align:center}.btn:disabled{opacity:.55;cursor:not-allowed}.notice,.success,.error{border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:12px}.notice{background:#10283a;color:#d1edff}.success{background:#103126;color:#d6ffee}.error{background:#35151b;color:#ffd0d6}.hidden{display:none!important}html[data-theme=light] .notice{background:#eaf5fc;color:#174966}html[data-theme=light] .success{background:#e8f7ef;color:#15563d}html[data-theme=light] .error{background:#fff0f2;color:#8a2634}
</style>
</head>
<body><main class="box"><div class="brand"><b>SAE</b> ENERGY · PANEL VISION</div><h1>Buat Password Baru</h1><div class="muted">Gunakan minimal 8 karakter. Link reset hanya dapat digunakan sesuai masa berlaku dari email.</div><div id="form" class="hidden"><div class="field"><label>Password baru</label><input class="input" id="password" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Ulangi password baru</label><input class="input" id="confirmPassword" type="password" minlength="8" autocomplete="new-password"></div><label class="show-password"><input id="showPasswords" type="checkbox">Tampilkan password</label><button class="btn" id="saveBtn">Simpan Password Baru</button></div><div id="msg" class="notice">Memeriksa link reset…</div><a class="btn hidden" id="openLogin" href="my-devices.html?v=20260903a">Kembali ke Login</a></main>
<script>
const SB_URL='https://sswslwddemackxrrbpre.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzd3Nsd2RkZW1hY2t4cnJicHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTE2MjcsImV4cCI6MjA5MTMyNzYyN30.aQivrCTGvzJ6-_OLUOUvFjOcu7qQ53Ajv2urvLZb9xg';
const sb=supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id);let recoveryReady=false;
function status(text,type='notice'){$('msg').className=type;$('msg').textContent=text}
function enableForm(){$('form').classList.remove('hidden');recoveryReady=true;status('Link reset terverifikasi. Silakan buat password baru.')}
$('showPasswords').onchange=()=>{const type=$('showPasswords').checked?'text':'password';$('password').type=type;$('confirmPassword').type=type};
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)enableForm()});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)enableForm();else setTimeout(()=>{if(!recoveryReady)status('Link reset tidak valid atau sudah kedaluwarsa. Silakan minta link baru dari halaman login.','error')},1500)})();
$('saveBtn').onclick=async()=>{const password=$('password').value,confirmation=$('confirmPassword').value;if(password.length<8)return status('Password minimal 8 karakter.','error');if(password!==confirmation)return status('Ulangi password belum sama.','error');$('saveBtn').disabled=true;status('Menyimpan password…');const {error}=await sb.auth.updateUser({password});$('saveBtn').disabled=false;if(error)return status(error.message,'error');$('form').classList.add('hidden');$('openLogin').classList.remove('hidden');status('Password berhasil diubah. Silakan kembali ke halaman login.','success')};
</script>
</body>
</html>
